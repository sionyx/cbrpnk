rokhRightLegHp = Math.min(6, $shorokhRightLegHp + 1)>>\n<<set $shorokhLeftLegHp = Math.min(6, $shorokhLeftLegHp + 1)>>\n<<else>>\n<<set $michaelProvidedFirstAid = false>>\n<<endif>>\n<<endif>>\n<<endif>>\n\n/* Проверки сцены убийства отсутствуют: Майкл и Тахи являются NPC. */\n\n/* Шорох скрыто оценивает повреждённый диск внутренних камер. */\n<<if $shorokhPrecinctDriveCheckTotal is null>>\n<<set $shorokhPrecinctDriveDie1 = random(1, 6)>>\n<<set $shorokhPrecinctDriveDie2 = random(1, 6)>>\n<<set $shorokhPrecinctDriveDie3 = random(1, 6)>>\n<<set $shorokhPrecinctDriveCheckTotal = $shorokhPrecinctDriveDie1 + $shorokhPrecinctDriveDie2 + $shorokhPrecinctDriveDie3 + 3>>\n<<if $shorokhPrecinctDriveCheckTotal >= 11>>\n<<set $shorokhRecognizedRepairablePrecinctDrive = true>>\n<<set $hasDamagedPrecinctDrive = true>>\n<<else>>\n<<set $shorokhRecognizedRepairablePrecinctDrive = false>>\n<<set $hasDamagedPrecinctDrive = false>>\n<<endif>>\n<<endif>>\n\n/* Майкл скрыто ищет и пытается снять внешнюю камеру. */\n<<if $michaelCameraSearchTotal is null>>\n<<set $michaelCameraSearchDie1 = random(1, 6)>>\n<<set $michaelCameraSearchDie2 = random(1, 6)>>\n<<set $michaelCameraSearchDie3 = random(1, 6)>>\n<<set $michaelCameraSearchTotal = $michaelCameraSearchDie1 + $michaelCameraSearchDie2 + $michaelCameraSearchDie3 + 1 + 1>>\n<<if $michaelCameraSearchTotal >= 11>>\n<<set $michaelFoundExternalCamera = true>>\n<<set $michaelCameraClimbDie1 = random(1, 6)>>\n<<set $michaelCameraClimbDie2 = random(1, 6)>>\n<<set $michaelCameraClimbDie3 = random(1, 6)>>\n<<set $michaelCameraClimbTotal = $michaelCameraClimbDie1 + $michaelCameraClimbDie2 + $michaelCameraClimbDie3 + 3>>\n<<if $michaelCameraClimbTotal >= 11>>\n<<set $michaelRetrievedExternalCamera = true>>\n<<set $shorokhHasExternalCameraDrive = true>>\n<<if $gameHour < 11>>\n<<set $externalCameraHasAttackRecording = true>>\n<<else>>\n<<set $externalCameraHasAttackRecording = false>>\n<<endif>>\n<<else>>\n<<set $michaelRetrievedExternalCamera = false>>\n<<set $shorokhHasExternalCameraDrive = false>>\n<<set $externalCameraHasAttackRecording = false>>\n<<endif>>\n<<else>>\n<<set $michaelFoundExternalCamera = false>>\n<<set $shorokhHasExternalCameraDrive = false>>\n<<set $externalCameraHasAttackRecording = false>>\n<<endif>>\n<<endif>>\n<<endif>>\n<</silently>>\n\n*Пока Тео находится в PsyOps, проверки остальных героев разрешаются скрыто. Игрок узнает результаты из их последовательного рассказа после воссоединения.*\n\n[[Вернуться к команде->S17 — Воссоединение перед концом часа]]\n\n","S17 — Воссоединение перед концом часа":"*Тео возвращается к полицейским машинам перед девятым участком. Остальные уже ждут её.*\n\n**Тео**\n\n— Я закончила. Где была — пока не спрашивайте. Лучше расскажите по порядку, что вы нашли внутри.\n\n//Факт поездки Тео в PsyOps переопределяет стандартную вероятность 80/20: он всегда скрыт от Майкла, Тахи и Рил. При прохождении за Тео игрок уже знает о поездке, поскольку самостоятельно прошёл её сцену, но в кат-сцене воссоединения не получает варианта рассказать о ней. При прохождении за Шороха игрок узнаёт тайну из звонка Тео, но также не получает варианта её выдать: Шорох сохраняет тайну и как NPC, и как выбранный персонаж. `$teamKnowsTheoVisitedPsyOps` остаётся false, а `$shorokhKnowsTheoVisitedPsyOps` уже установлен в true.//\n\n<<if $precinctResolvedOffscreen>>\nОставшиеся герои по очереди рассказывают Тео всё публичное, что произошло в участке. Каждый продолжает живой разговор с того места, на котором остановился предыдущий; проверки раскрытия 80/20 здесь не выполняются.\n\n[[Выслушать Рил->R01 — Рил рассказывает о первом сканировании]]\n<<else>>\n[[Продолжить после уже известного осмотра->S17B — После сводки участка]]\n<<endif>>\n\n","R01 — Рил рассказывает о первом сканировании":"<<if $reLPrecinctLifeScanSucceeded>>\n**Рил**\n\n— Ещё снаружи я просканировала здание. Живых внутри не обнаружила.\n<<else>>\n**Рил**\n\n— Я пыталась просканировать здание ещё снаружи, но стены и помехи заглушили сигнал. Внутри были неподвижные силуэты, а живы они или нет, я тогда понять не смогла.\n<<endif>>\n\n[[Передать слово Шороху->R02 — Шорох рассказывает о входе в участок]]\n\n","R02 — Шорох рассказывает о входе в участок":"<<if $shorokhTriedPrecinctSurveillanceConnection>>\n**Шорох**\n\n— Я подключился к внутренней системе наблюдения. Она повреждена и ничего не отдала.\n<<if $shorokhPrecinctSurveillanceCheckSucceeded is false>>\n\n*Шорох показывает повреждённую левую киберруку.*\n\n— Ещё и сдачи дала. Осталось **$shorokhLeftArmHp из 3 HP**.\n<<endif>>\n<<else>>\n**Шорох**\n\n— К наружной системе наблюдения я подключаться не стал. Выглядела она так, будто только и ждала, кто первым сунется.\n<<endif>>\n\n<<if $shorokhAvoidedPrecinctMine>>\n— А у входа стояла мина. Луч я заметил и переступил. Дальше с ней работал Тахи.\n\n[[Выслушать Тахи о мине->R09 — Тахи рассказывает об обезвреживании]]\n<<else>>\n— А у входа стояла мина. Луч я заметил уже ногами. Она взорвалась и зацепила обе.\n\n[[Выслушать Майкла->R03 — Майкл рассказывает о первой помощи]]\n<<endif>>\n\n","R03 — Майкл рассказывает о первой помощи":"*Майкл кивает на ноги Шороха.*\n\n**Майкл Маклейн**\n\n<<if $michaelProvidedFirstAid>>\n— После взрыва я его подлатал. Правая нога — **$shorokhRightLegHp из 6 HP**, левая — **$shorokhLeftLegHp из 6 HP**.\n<<else>>\n— Мина зацепила обе ноги. Помочь на месте я ему не стал. Правая — **$shorokhRightLegHp из 6 HP**, левая — **$shorokhLeftLegHp из 6 HP**.\n<<endif>>\n\n[[Передать слово Тахи->R04 — Тахи рассказывает о погибших]]\n\n","R09 — Тахи рассказывает об обезвреживании":"**Тахи**\n\n<<if $tahiPrecinctMineDefusalSucceeded>>\n— Я разобрался со взрывателем и обезвредил мину. После этого мы вошли внутрь.\n\n[[Продолжить рассказ Тахи->R04 — Тахи рассказывает о погибших]]\n<<else>>\n*Тахи показывает повреждённые руки.*\n\n— Я попытался обезвредить её, но ошибся. Мина рванула прямо передо мной: зацепило обе руки и корпус. Правая рука — **$tahiRightArmHp из 7 HP**, левая — **$tahiLeftArmHp из 7 HP**, корпус — **$tahiTorsoHp из 12 HP**.\n\n[[Выслушать Майкла о помощи Тахи->R10 — Майкл рассказывает о помощи Тахи]]\n<<endif>>\n\n","R10 — Майкл рассказывает о помощи Тахи":"**Майкл Маклейн**\n\n<<if $michaelProvidedTahiFirstAid>>\n— Я обработал ранения. Всем трём повреждённым частям вернулось по одному HP.\n<<else>>\n— После взрыва я не стал обрабатывать ранения. Их состояние не изменилось.\n<<endif>>\n\n[[Продолжить рассказ Тахи->R04 — Тахи рассказывает о погибших]]\n\n","R04 — Тахи рассказывает о погибших":"**Тахи**\n\n— Внутри нашли полицейских, пленных Потрошителей и шефа Аарона Буча. Все мертвы. Стреляли точно, делали контрольные — работали опытные солдаты. Арсенал не тронули, внутренние камеры уничтожили.\n\n//Майкл и Тахи не проходят дополнительные проверки места убийства, если являются NPC.//\n\n[[Уточнить время смерти у Рил->R05 — Рил сообщает время смерти]]\n\n","R05 — Рил сообщает время смерти":"**Рил**\n\n— По состоянию тел, погибли они примерно в три часа ночи.\n\n[[Выслушать Шороха об оборудовании->R06 — Шорох рассказывает о внутреннем диске]]\n\n","R06 — Шорох рассказывает о внутреннем диске":"**Шорох**\n\n<<if $hasDamagedPrecinctDrive>>\n*Шорох достаёт повреждённый диск.*\n\n— Это осталось от внутренних камер. Сейчас он не читается, но, кажется, его можно восстановить. Я забрал.\n<<else>>\n— От внутренних камер нашёлся повреждённый диск. Я посмотрел — восстанавливать там нечего. Оставил внутри.\n<<endif>>\n\n[[Выслушать Майкла о внешней камере->R07 — Майкл рассказывает о внешней камере]]\n\n","R07 — Майкл рассказывает о внешней камере":"**Майкл Маклейн**\n\n<<if $shorokhHasExternalCameraDrive>>\n*Майкл показывает на камеру в руках Шороха.*\n\n— На соседней недостройке я заметил внешнюю камеру. Забрался, снял и передал Шороху. Что на диске, расскажет он.\n\n[[Выслушать Шороха о записи->R08 — Шорох рассказывает о записи внешней камеры]]\n<<elseif $michaelFoundExternalCamera>>\n— На соседней недостройке я заметил внешнюю камеру. Снять смог, а на спуске уронил. Камера и диск разбились.\n\nВсе перечисленные сведения теперь известны Тео и остаются публичным знанием команды.\n\n[[Завершить общую сводку->S17B — После сводки участка]]\n<<else>>\n— Я осмотрел здания вокруг, но внешнюю камеру так и не заметил.\n<<if $teamKnowsConvoyData>>\n\nКоманда по-прежнему знает о планах «Крион», укреплениях и организованных беспорядках, но без записи не может связать конвой с нападением на участок.\n<<endif>>\n\nВсе перечисленные сведения теперь известны Тео и остаются публичным знанием команды.\n\n[[Завершить общую сводку->S17B — После сводки участка]]\n<<endif>>\n\n","R08 — Шорох рассказывает о записи внешней камеры":"**Шорох**\n\n<<if $externalCameraHasAttackRecording and visited(\"S07 — 09:00–09:30. Конвой Lazarus\") > 0 and $teamKnowsConvoyData>>\n— Здесь два чёрных внедорожника. Из них выходят те же люди, которых мы видели в конвое Lazarus. Они врываются в участок, возвращаются к машинам и уезжают. Вместе с данными про «Крион», укрепления и беспорядки это уже не похоже на совпадение.\n<<elseif $externalCameraHasAttackRecording and visited(\"S07 — 09:00–09:30. Конвой Lazarus\") > 0>>\n— Здесь два чёрных внедорожника. Из них выходят те же люди, которых мы видели в конвое Lazarus. Они врываются в участок, возвращаются к машинам и уезжают. Но кому они служат, из этой записи не понять.\n<<elseif $externalCameraHasAttackRecording>>\n— Здесь два чёрных внедорожника и вооружённые люди. Они врываются в участок, возвращаются к машинам и уезжают. Лиц и принадлежности мы не знаем.\n<<else>>\n*Шорох отключает диск.*\n\n— Мы опоздали. Буфер восьмичасовой, и к одиннадцати запись нападения уже затёрло новым циклом. Здесь остались только свежие кадры — для расследования бесполезные.\n\nШорох оставляет камеру возле участка.\n\n//Это незначимая сюжетная деталь: камера полностью непригодна и не сохраняется как улика, бонус или ключ к будущей ветке.//\n<<endif>>\n\nВсе перечисленные сведения теперь известны Тео и остаются публичным знанием команды.\n\n[[Завершить общую сводку->S17B — После сводки участка]]\n\n","S17B — После сводки участка":"<<if $theoNeutralizedPsyOpsRobots>>\n*Тео отводит Шороха в сторону.*\n\n**Тео**\n\n— С роботами закончено. Возвращаться в PsyOps не нужно. Кого я там искала и что увидела — не спрашивай.\n<<else>>\n<<set $shorokhKnowsSweetJohnny = true>>\n*Тео отводит Шороха в сторону.*\n\n**Тео**\n\n— Джони жив, но роботов я не отключила. Мне придётся вернуться. На этот раз — с тобой.\n<<endif>>\n\n[[Выслушать Шороха->D07 — Шорох напоминает о встрече с Сэмми]]\n\n","D07 — Шорох напоминает о встрече с Сэмми":"**Шорох**\n\n— И ещё: в одиннадцать меня ждёт Тощий Сэмми у метро Blue Skyport. Он не из тех, кто будет ждать второй раз.\n\n[[Выбрать дальнейший маршрут->S18 — Выбор после посещения участка]]\n\n","S17A — Тео осталась в участке":"*Тео всё время оставалась с командой и наблюдала за осмотром участка.*\n\n**Тео**\n\n— Здесь я больше ничем не помогу. Решайте следующий маршрут.\n\n[[Выслушать Шороха->D07 — Шорох напоминает о встрече с Сэмми]]\n\n","S18 — Выбор после посещения участка":"*Команда собирается у полицейской машины. Маршрут к шефу ведёт через улицу, на которой позднее появится киберпсих.*\n\n**Шорох**\n\n<<if $theoNeutralizedPsyOpsRobots>>\n— С PsyOps закончено. Остаётся Сэмми, Большой Бо — если ещё ждёт — и возвращение к шефу. Едем вместе или разделяемся?\n<<elseif $theoVisitedPsyOps>>\n— Мне нужно к Сэмми, а потом с Тео обратно в PsyOps. Остальные могут ехать к шефу или к Большому Бо. Разделяемся?\n<<else>>\n— Мне нужно к Сэмми. Тео просит после этого заглянуть с ней в PsyOps. Остальные могут ехать к шефу или к Большому Бо. Что выбираем?\n<<endif>>\n\n<<if $gameHour == 10>>\n<<if not $theoNeutralizedPsyOpsRobots>>\n[[Разделиться как в сыгранной сессии: Шорох и Тео — к метро, остальные — к шефу->S19 — Автобус и киберпсих][$gameHour = 11]]\n<<else>>\n[[Выбрать новый маршрут без возвращения в PsyOps->U09 — Маршрут после спасения Сладкого Джони][$gameHour = 11]]\n<<endif>>\n<<else>>\n[[Всей командой вернуться к шефу->U04 — Вся команда встречает киберпсиха][$gameHour = 10]]\n<<if $teamKnowsBigBoMeeting and $gameHour < 11>>\n<<if not $theoNeutralizedPsyOpsRobots>>\n[[Разделиться: Майкл, Тахи и Рил — к Большому Бо; Шорох и Тео — в PsyOps->U03 — Большой Бо и PsyOps][$gameHour = 10]]\n<<endif>>\n[[Поехать всей командой к Большому Бо->U01 — Команда встретила Большого Бо][$gameHour = 10]]\n<<endif>>\n<<endif>>\n\n","U03 — Большой Бо и PsyOps":"<<set $visitedBigBo = true>>\n<<set $knowsStadiumPlan = true>>\n<<set $shorokhKnowsSweetJohnny = true>>\n*Майкл, Тахи и Рил успевают в Paradiso до дедлайна Большого Бо.*\n\n**Большой Бо**\n\n— В полдень на парковке стадиона Detroit Rangers готовится встреча. Люди там будут тяжело вооружены. Если хотите пережить день — не опаздывайте и смотрите, кому доверяете.\n\n//Если Тео уже была в PsyOps, ветка доступна после провала проверки памяти Шороха. Если она осталась в участке, это первое посещение офиса. Подробные сцены обеих групп будут добавлены позднее.//\n\n[[Переключиться на Тео и Шороха->D08 — Тео ведёт Шороха в PsyOps]]\n\n","D08 — Тео ведёт Шороха в PsyOps":"*Параллельно Тео и Шорох останавливаются у закрытого офиса PsyOps.*\n\n**Тео**\n\n<<if $theoVisitedPsyOps>>\n— Я уже была внутри. Роботы всё ещё активны, а Джони остался там. Теперь покажу дорогу — ты их отключишь.\n<<else>>\n— Джони работал здесь и перестал отвечать ночью. Мне нужно попасть внутрь. Поможешь, а вопросы задашь потом.\n<<endif>>\n\n[[Продолжить к точке синхронизации->SYNC01 — Сбор команды перед стадионом]]\n\n","U04 — Вся команда встречает киберпсиха":"*На пути к одиннадцатому участку перед машиной падает автобус. На его крыше появляется киберпсих.*\n\n**Майкл Маклейн**\n\n— Все пятеро здесь. Гражданских отводим за укрытия, цель берём вместе. Шеф велел не вступать в перестрелки, но эту тварь мимо не пропустим.\n\n//Заглушка: состав участников отличается от сыгранной битвы, поэтому её подробный ход и последствия будут добавлены отдельно.//\n\n[[После уличной битвы->U05 — После битвы всей команды]]\n\n","U09 — Маршрут после спасения Сладкого Джони":"**Тео**\n\n<<if $selectedCharacter is \"theo\">>\n— В PsyOps возвращаться не нужно. Я закончила там всё, что могла. Выбирайте: едем к шефу вместе или делимся, чтобы Шорох успел к Сэмми.\n<<else>>\n— Возвращаться в PsyOps и помогать с роботами больше не требуется. Остальное не спрашивай. Выбираем: к шефу вместе или мы с Шорохом едем к Сэмми?\n<<endif>>\n\n[[Всей командой поехать к шефу полиции->U10 — Вся команда едет к шефу после спасения Джони]]\n[[Разделиться: Тео и Шорох — к Тощему Сэмми; Майкл, Тахи и Рил — к шефу->S19 — Автобус и киберпсих]]\n\n","U10 — Вся команда едет к шефу после спасения Джони":"*В 11:00 все пятеро направляются к шефу и встречают киберпсиха. Подробный ход боя будет добавлен вместе с боевой механикой.*\n\n**Майкл Маклейн**\n\n— Работаем вместе. Мы его остановим, но без тяжёлых ранений, похоже, не обойдётся. После боя сразу в больницу.\n\n[[После победы ехать в больницу->U05 — После битвы всей команды]]\n\n","S19 — Автобус и киберпсих":"*Перед машиной падает пассажирский автобус. Из-за угла выбегают люди; киберпсих с клинками богомола запрыгивает на крышу и хватает женщину.*\n\n**Майкл Маклейн**\n\n— Рил, ищи высоту. Тахи, выводи людей с линии огня. Приказ был не вмешиваться, но оставить их ему мы не можем.\n\n[[Дальше →->S20 — Бой с киберпсихом]]\n\n","S20 — Бой с киберпсихом":"*Рил выходит на огневую позицию над улицей. Её голос звучит в общем канале между выстрелами.*\n\n**Рил**\n\n— Первое попадание в голову. Цель ещё движется. Майкл, прижми его огнём. Тахи идёт машиной... Киберпсих на капоте. Обе руки Тахи повреждены, правая отсечена. Машина прижала цель к зданию. Второй выстрел. Цель уничтожена. Тахи без сознания — нужна срочная помощь.\n\n<<if $teamKnowsBigBoMeeting and not $visitedBigBo>>\n[[Дальше →->S21 — Звонок Большого Бо]]\n<<else>>\n[[Параллельно: встреча у метро →->S22 — Последнее предупреждение Сэмми]]\n<<endif>>\n\n","U05 — После битвы всей команды":"<<set $fullTeamCyberpsychoBattle = true>>\n*Киберпсих уничтожен. Один из героев тяжело ранен; команда готовит полицейскую машину к выезду в больницу.*\n\n**Шорох**\n\n— Вы везите раненого. Я ещё могу успеть к Сэмми на метро и потом встречу вас. Или останусь — решаем сейчас.\n\n//Заглушка: личность раненого, характер травм и конкретные действия в бою будут определены при обсуждении боевой механики. Состав участников битвы не изменяет дальнейший общий сюжет.//\n\nШорох может отделиться от команды и самостоятельно доехать на метро до назначенной встречи с Тощим Сэмми; тогда остальные четыре героя повезут раненого в больницу. Если Шорох останется с ними, встреча будет пропущена.\n\n[[Отделиться и ехать к Тощему Сэмми на метро->S22 — Последнее предупреждение Сэмми]]\n[[Остаться с командой и ехать в больницу->SYNC01 — Сбор команды перед стадионом]]\n\n","U11 — После Сэмми и больницы":"*После встречи с Сэмми Шорох связывается с командой, пока остальные спасают раненого в больнице.*\n\n**Шорох**\n\n— Я узнал главное: в полдень на парковке Detroit Rangers будет встреча Потрошителей с тяжело вооружёнными людьми. Я еду прямо туда. Заканчивайте в больнице и присоединяйтесь.\n\n[[Дождаться остальных у стадиона->SYNC01 — Сбор команды перед стадионом]]\n\n","S21 — Звонок Большого Бо":"*На КПК потерявшего сознание Тахи звонит Большой Бо. Рил принимает вызов и сообщает о ранении.*\n\n**Большой Бо**\n\n— Он не приехал до одиннадцати. То, о чём я просил утром, уже не сделать. Передай Тахи: если хочет выжить, в семнадцать часов пусть один приходит в порт и уходит с нами. Другого шанса не будет.\n\n[[Остаться с Тахи->D09 — Дух предка обращается к Тахи]]\n\n","D09 — Дух предка обращается к Тахи":"*В беспамятстве Тахи видит духов племени среди дыма и красного света.*\n\n**Дух предка**\n\n— Кровь зовёт тебя домой. Но прежде ответь: кого ты теперь называешь своими?\n\n[[Ответить духу->D10 — Тахи выбирает своих]]\n\n","D10 — Тахи выбирает своих":"**Тахи**\n\n— Мои — люди Дойла. Те, кто сейчас тащит меня к врачу. Я выбрал эту команду.\n\n[[Параллельно: встреча у метро →->S22 — Последнее предупреждение Сэмми]]\n\n","S22 — Последнее предупреждение Сэмми":"<<set $knowsStadiumPlan = true>>\n*На станции Blue Skyport Тощий Сэмми нервно оглядывает платформу и вкладывает Шороху в руку последнюю упаковку нейроблокаторов.*\n\n**Тощий Сэмми**\n\n— Ещё пара минут — и я бы уехал. Больше поставок не будет, ищи другого дилера. Но ты меня не сдавал, поэтому слушай: в полдень Потрошители встречаются с очень опасными вооружёнными людьми на парковке Detroit Rangers. Там будет много трупов. Блокираторы забирай бесплатно и уезжай из района. За мной уже идут.\n\n*Сэмми прыгает в вагон. Следом входят двое крепких преследователей.*\n\n<<if $fullTeamCyberpsychoBattle>>\n*Шорох направляется прямо к стадиону. Параллельно команда спасает раненого героя в больнице; дорога и её длительность остаются за кадром.*\n\n[[Продолжить параллельные маршруты->U11 — После Сэмми и больницы]]\n<<elseif $theoNeutralizedPsyOpsRobots>>\n<<if $selectedCharacter is \"theo\">>\n*Роботы уже обезврежены, поэтому Тео и Шорох едут прямо на стадион. Параллельно Майкл и Рил везут раненого Тахи к тайному риперу Arasaka.*\n<<else>>\n*Тео сообщила, что помощь в PsyOps больше не нужна, и вместе с Шорохом едет прямо на стадион. Шорох по-прежнему не знает цели её поездки. Параллельно Майкл и Рил везут раненого Тахи к тайному риперу Arasaka.*\n<<endif>>\n\n[[Параллельно: операция Тахи->S26 — Операция Тахи]]\n<<else>>\n[[Дальше →->S23 — Связь после боя]]\n<<endif>>\n\n","S23 — Связь после боя":"<<set $shorokhKnowsSweetJohnny = true>>\n*Связь между разделившимися группами восстанавливается после боя.*\n\n**Шорох**\n\n— В двенадцать на парковке Detroit Rangers будет заварушка: Потрошители встречаются с тяжело вооружёнными людьми. Майкл, доложи шефу и вези Тахи к врачу. Мы с Тео пока рядом с Blue Skyport.\n\n[[Связаться с Дойлом->D11 — Дойл отвечает команде]]\n\n","D11 — Дойл отвечает команде":"**Шеф Кристиан Дойл**\n\n— Подмоги не будет. Десятый участок открещивается, девятый уничтожен. И я выяснил, что Джонатан Лайт связан с новым окружным прокурором — там всё повязано. К двум часам жду вас в участке. До этого собирайте сведения, но полагайтесь только на себя.\n\n[[Вернуться в общий канал->D12 — Шорох распределяет маршруты]]\n\n","D12 — Шорох распределяет маршруты":"**Шорох**\n\n— Мы с Тео сначала едем в PsyOps за её парнем, потом — на стадион. Как закончите с Тахи, приезжайте туда. В бой без нас не вступайте.\n\n[[Дальше →->S24 — Офис PsyOps]]\n\n","S24 — Офис PsyOps":"*Тео приводит Шороха к открытому окну PsyOps. Он выбирает домофон, подключается к внутренней сети и перехватывает управление роботами.*\n\n**Шорох**\n\n— Ремонтный и три боевых дроида теперь считают меня командиром. Приказы примут, но каждый удалённый контакт будет бить по импланту — долго так играть нельзя. Вирус в сети тоже обезврежен. Он уже выжег двух нетраннеров; больше никого не получит.\n\n[[Дальше →->S25 — Сладкий Джони приходит в себя]]\n\n","S25 — Сладкий Джони приходит в себя":"<<set $sweetJohnnyRescued = true>>\n*Тео приводит Джони в чувство после передозировки стимулятором. Шорох тем временем извлекает с сервера переписку погибших нетраннеров.*\n\n**Сладкий Джони**\n\n— Они мертвы, да? Оба... Я понял. Тео, я соберу вещи и уеду. После того, что случилось с «Крионом», оставаться здесь нельзя.\n\n[[Дальше →->S25A — Прощание Тео и Сладкого Джони]]\n\n","S25A — Прощание Тео и Сладкого Джони":"<<set $theoLeftSweetJohnny = true>>\n*Джони благодарит Тео за спасение. Пока он остаётся собирать вещи, Тео направляется к выходу.*\n\n**Сладкий Джони**\n\n— Эй, Тео! Тут всякая херня происходит... Но когда всё закончится, может, на следующей неделе сходим в клуб «Шторм»?\n\n*Тео долго смотрит на него, подходит и вместо ответа снова бьёт.*\n\n— Да ладно, понял. Могла бы просто сказать «нет». Не хочешь — не надо.\n\n//Диалог восстановлен по исходной записи сессии: 03:14:32–03:15:07. Текстовый транскрипт в этом месте повреждён.//\n//На этом линия Сладкого Джони в текущей части игры завершена. Возможное возвращение персонажа может быть отдельно добавлено только при разработке второй части.//\n\n<<if visited(\"U06 — Тео обезвредила роботов\")>>\n[[Вернуться к команде после параллельного осмотра->C20 — Скрытые проверки группы в участке]]\n<<else>>\n[[Параллельно: рипер Arasaka →->S26 — Операция Тахи]]\n<<endif>>\n\n","S26 — Операция Тахи":"*Майкл и Рил доставляют Тахи к тайному риперу Arasaka. Техник заканчивает диагностику обеих рук.*\n\n**Рипер Arasaka**\n\n— Мозг не повреждён. Левую руку зафиксирую и сохраню, правую придётся заменить. Корпорация покрывает одну операцию. Пациент уже выбрал экспериментальный протез с огнемётом — начинаю установку.\n\n<<if $theoNeutralizedPsyOpsRobots>>\n[[Собрать всю команду на стадионе->SYNC01 — Сбор команды перед стадионом]]\n<<else>>\n[[Дальше →->S27 — Конец первой сессии]]\n<<endif>>\n\n","S27 — Конец первой сессии":"*Шорох и Тео покидают PsyOps с четырьмя захваченными дроидами. Майкл и Рил ещё ждут завершения операции Тахи.*\n\n**Шорох**\n\n— Джони собирается уезжать, дроиды идут с нами. Следующая точка — парковка Detroit Rangers к полудню. После операции догоняйте. И не забывайте: по городу ещё ходит слух о чём-то вроде теракта в восемнадцать часов.\n\nГлавный конфликт, содержание сцены на стадионе и дальнейшие события должны проясниться после второй офлайн-сессии.\n\n[[Собрать команду перед стадионом->SYNC01 — Сбор команды перед стадионом]]\n\n","SYNC01 — Сбор команды перед стадионом":"<<set $teamReunitedForStadium = true>>\n*К полудню Шорох, Майкл, Тахи, Тео и Рил снова собираются вместе. Утренние маршруты сходятся перед стадионом.*\n\n**Шорох**\n\n— Все на месте. Рассказываем по очереди только то, что готовы открыть. Но сведения о стадионе не скрываем — от них сейчас зависит жизнь всей команды.\n\n//До прибытия на стадион Тео и Шорох всегда скрывают существование её импланта от Майкла и остальных. Пользовательского выбора и случайной проверки для раскрытия этого факта в утреннем графе нет; `$teamKnowsTheoHasImplant` остаётся false. Возможное раскрытие после стадиона относится к будущей части сюжета.//\n\n//В будущей полной кат-сцене каждый новый говорящий получает отдельный passage с аватаром. Игрок сам решает, какие необязательные факты раскрывает его герой; для каждого факта NPC действует отдельная проверка 80/20. Сюжетно-критические сведения, включая событие на стадионе, сообщаются автоматически.//\n\n<<if $knowsStadiumPlan>>\n<<if $visitedBigBo and visited(\"S22 — Последнее предупреждение Сэмми\") > 0>>\n— Большой Бо и Тощий Сэмми независимо указали на Detroit Rangers. Значит, это не слух.\n<<elseif $visitedBigBo>>\n— Большой Бо предупредил о встрече на Detroit Rangers. Этого достаточно, чтобы проверить стадион.\n<<else>>\n— Сэмми предупредил: Потрошители встретятся с вооружённой группой на Detroit Rangers. Проверяем.\n<<endif>>\n[[В 12:00 прибыть на стадион полным составом->F01 — 12:00. Стадион Detroit Rangers]]\n<<else>>\n— Ни к Большому Бо, ни к Сэмми мы не успели. Пока у нас нет следующей точки.\n\n[[Ответить на срочный звонок шефа->C02 — 12:00. Звонок шефа]]\n<<endif>>\n\n","C02 — 12:00. Звонок шефа":"<<set $gameHour = 12>>\n<<set $knowsStadiumPlan = true>>\n*Ровно в 12:00 Дойл выходит на связь с собравшейся командой.*\n\n**Шеф Кристиан Дойл**\n\n— Срочное сообщение: на стадионе Detroit Rangers что-то готовится. Всем немедленно выдвигаться туда. Дорогу не обсуждаем — действуйте.\n\nЭто сюжетное допущение не расходует внутриигровое время на дорогу: сразу после звонка действие переносится на стадион.\n\n[[Немедленно оказаться на стадионе->F01 — 12:00. Стадион Detroit Rangers]]\n\n","F01 — 12:00. Стадион Detroit Rangers":"<<set $gameHour = 12>>\n<<if $knowsStadiumPlan and $teamReunitedForStadium>>\n<<if visited(\"C02 — 12:00. Звонок шефа\") > 0>>\n*Сразу после звонка Дойла действие переносится на стадион. Вся команда оказывается у Detroit Rangers полным составом.*\n<<else>>\n*К 12:00 вся команда полным составом прибывает на стадион Detroit Rangers.*\n<<endif>>\n\n**Шорох**\n\n— Вот и стадион. Всё, что мы узнали утром, сейчас либо поможет нам, либо ударит по нам. Дальше идём вместе.\n<<else>>\n//Ошибка структуры: переход к стадиону возможен только после получения сведений и воссоединения всей команды.//\n<<endif>>\n\n//Обязательная финальная точка текущего графа. Содержание сцены на стадионе и продолжение сюжета будут добавлены после второй офлайн-сессии.//\n\n"};

      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function visited(name) {
      return visits[name] || 0;
    }

    function toJavaScript(expression) {
      return expression
        .replace(/\$([A-Za-z_][A-Za-z0-9_]*)/g, "state.$1")
        .replace(/\bisnot\b/g, "!==")
        .replace(/\bis not\b/g, "!==")
        .replace(/\bis\b/g, "===")
        .replace(/\band\b/g, "&&")
        .replace(/\bor\b/g, "||")
        .replace(/\bnot\b/g, "!");
    }

    function evaluate(expression) {
      try {
        return Boolean(Function("state", "visited", "random", "return (" + toJavaScript(expression) + ");")(state, visited, random));
      } catch (error) {
        console.error("Не удалось вычислить условие:", expression, error);
        return false;
      }
    }

    function execute(statement) {
      try {
        Function("state", "visited", "random", toJavaScript(statement) + ";")(state, visited, random);
      } catch (error) {
        console.error("Не удалось изменить состояние:", statement, error);
      }
    }

    function isActive(stack) {
      return stack.every(frame => frame.active);
    }

    function parseLink(token) {
      const inner = token.slice(2, -2);
      const arrow = inner.indexOf("->");
      if (arrow < 0) return null;
      const label = inner.slice(0, arrow).trim().replace(/\s*[→›]\s*$/, "");
      let destination = inner.slice(arrow + 2).trim();
      let setter = "";
      const setterStart = destination.lastIndexOf("][");
      if (setterStart >= 0) {
        setter = destination.slice(setterStart + 2).trim();
        destination = destination.slice(0, setterStart).trim();
      }
      return { label, destination, setter };
    }

    function processPassage(name, executeMacros = true) {
      const source = passages[name];
      if (source == null) return { body: "Не найдена следующая сцена.", choices: [] };

      const conditionStack = [];
      let silentDepth = 0;
      let body = "";
      const choices = [];
      const tokens = source.split(/(<<[\s\S]*?>>|\[\[[\s\S]*?\]\])/g);

      for (const token of tokens) {
        if (!token) continue;
        if (token.startsWith("<<") && token.endsWith(">>")) {
          const macro = token.slice(2, -2).trim();
          if (macro.startsWith("if ")) {
            const parentActive = isActive(conditionStack);
            const result = parentActive && evaluate(macro.slice(3));
            conditionStack.push({ parentActive, active: result, matched: result });
          } else if (macro.startsWith("elseif ")) {
            const frame = conditionStack.at(-1);
            if (frame) {
              const result = frame.parentActive && !frame.matched && evaluate(macro.slice(7));
              frame.active = result;
              frame.matched ||= result;
            }
          } else if (macro === "else") {
            const frame = conditionStack.at(-1);
            if (frame) {
              frame.active = frame.parentActive && !frame.matched;
              frame.matched = true;
            }
          } else if (macro === "endif") {
            conditionStack.pop();
          } else if (macro === "silently") {
            silentDepth += 1;
          } else if (macro === "/silently") {
            silentDepth = Math.max(0, silentDepth - 1);
          } else if (macro.startsWith("set ") && isActive(conditionStack) && executeMacros) {
            execute(macro.slice(4));
          }
          continue;
        }

        if (!isActive(conditionStack)) continue;
        if (token.startsWith("[[") && token.endsWith("]]")) {
          if (!silentDepth) {
            const link = parseLink(token);
            if (link) choices.push(link);
          }
        } else if (!silentDepth) {
          body += token;
        }
      }

      return { body, choices };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function interpolate(text) {
      return text.replace(/\$([A-Za-z_][A-Za-z0-9_]*)/g, (_, key) => {
        const value = state[key];
        if (value === true) return "да";
        if (value === false) return "нет";
        if (value == null) return "—";
        return String(value);
      });
    }

    function inlineMarkup(text) {
      return escapeHtml(interpolate(text))
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/''(.+?)''/g, "<strong>$1</strong>")
        .replace(/\x60(.+?)\x60/g, "<code>$1</code>");
    }

    function proseToHtml(raw) {
      const cleaned = raw
        .split(/\r?\n/)
        .filter(line => !/^\s*\/\/.*\/\/\s*$/.test(line))
        .join("\n")
        .trim();
      if (!cleaned) return "";

      const blocks = cleaned.split(/\n\s*\n/);
      return blocks.map(block => {
        const lines = block.split("\n").map(line => line.trim()).filter(Boolean);
        if (lines.every(line => /^\*\s+/.test(line))) {
          return "<ul>" + lines.map(line => "<li>" + inlineMarkup(line.replace(/^\*\s+/, "")) + "</li>").join("") + "</ul>";
        }
        return "<p>" + inlineMarkup(lines.join(" ")) + "</p>";
      }).join("");
    }

    function dialogueParts(raw) {
      const match = raw.match(/^([\s\S]*?)^\s*\*\*([^*]+)\*\*\s*$([\s\S]*)/m);
      if (!match) return { narration: raw.trim(), speaker: "", speech: "" };
      return {
        narration: match[1].trim(),
        speaker: match[2].trim(),
        speech: match[3].trim()
      };
    }

    function resolveVisiblePassage(name, executeMacros, countVisit) {
      let nextName = name;
      let nextExecuteMacros = executeMacros;
      let nextCountVisit = countVisit;

      for (let hop = 0; hop < 20; hop += 1) {
        currentPassage = nextName;
        if (nextCountVisit) visits[nextName] = (visits[nextName] || 0) + 1;
        const result = processPassage(nextName, nextExecuteMacros);
        const tags = passageTags[nextName] || [];
        const shouldAutoAdvance = tags.includes("auto") ||
          (tags.includes("hidden") && result.choices.length === 1);
        if (!shouldAutoAdvance) return { name: nextName, result };
        if (result.choices.length !== 1) {
          return {
            name: nextName,
            result: {
              body: "Ошибка автоматического перехода: ожидался один доступный маршрут.",
              choices: []
            }
          };
        }

        const choice = result.choices[0];
        if (choice.setter && nextExecuteMacros) execute(choice.setter);
        nextName = choice.destination;
        nextCountVisit = countVisit;
      }

      return {
        name: nextName,
        result: { body: "Ошибка автоматического перехода: превышен лимит маршрутизации.", choices: [] }
      };
    }

    function cleanTitle(name) {
      if (name === "Start") return "Первая смена";
      return name.replace(/^(?:[PSCURF]\d+[A-Z]?|SYNC\d+)\s*—\s*/, "");
    }

    function contextLabel(name) {
      if (name === "Start") return "Даллас · вторая половина XXI века";
      if (/^P\d+\s*—/.test(name)) return "Выбор персонажа";
      const time = cleanTitle(name).match(/\b(\d{2}:\d{2}(?:[–—-]\d{2}:\d{2})?)\b/);
      const character = characterNames[state.selectedCharacter];
      return [time?.[1], character].filter(Boolean).join(" · ") || "Blue Skyport · первая сессия";
    }

    function choiceLabel(choice, choiceCount, name) {
      if (choiceCount === 1) return "Дальше";
      if (name === "Start") {
        const forms = {
          "Шорох": "Выбрать Шороха",
          "Майкл Маклейн": "Выбрать Майкла",
          "Тахи": "Выбрать Тахи",
          "Тео Маклейн": "Выбрать Тео",
          "Рил": "Выбрать Рил"
        };
        return forms[choice.label] || choice.label;
      }
      return choice.label;
    }

    function snapshot() {
      return {
        passage: currentPassage,
        state: structuredClone(state),
        visits: structuredClone(visits)
      };
    }

    function save() {
      localStorage.setItem(storageKey, JSON.stringify({
        currentPassage,
        state,
        visits,
        history
      }));
    }

    function render(name, executeMacros = true, countVisit = true) {
      const resolved = resolveVisiblePassage(name, executeMacros, countVisit);
      name = resolved.name;
      currentPassage = name;
      const result = resolved.result;
      const choicesClass = result.choices.length > 1 ? "choices multiple" : "choices";
      const ending = result.choices.length === 0
        ? '<div class="ending">Продолжение истории появится в следующей сборке.</div>'
        : "";
      const parts = dialogueParts(result.body);
      const avatar = avatarData[parts.speaker];
      const dialogueClass = avatar ? "dialogue" : "dialogue without-avatar";
      const avatarHtml = avatar
        ? '<img class="avatar" src="' + avatar + '" alt="' + escapeHtml(parts.speaker) + '">'
        : "";
      const narrationHtml = parts.narration
        ? '<div class="narration copy">' + proseToHtml(parts.narration) + '</div>'
        : "";
      const dialogueHtml = parts.speaker
        ? '<div class="' + dialogueClass + '">' +
            avatarHtml +
            '<div class="speech">' +
              '<p class="speaker-name">' + escapeHtml(parts.speaker) + '</p>' +
              '<div class="copy">' + proseToHtml(parts.speech) + '</div>' +
            '</div>' +
          '</div>'
        : "";

      scene.classList.remove("scene");
      void scene.offsetWidth;
      scene.classList.add("scene");
      scene.innerHTML =
        '<p class="eyebrow">' + escapeHtml(contextLabel(name)) + '</p>' +
        '<h1>' + escapeHtml(cleanTitle(name)) + '</h1>' +
        narrationHtml +
        dialogueHtml +
        '<div class="' + choicesClass + '" aria-label="Варианты действия">' +
          result.choices.map((choice, index) =>
            '<button class="choice" type="button" data-choice="' + index + '">' +
              '<span>' + escapeHtml(choiceLabel(choice, result.choices.length, name)) + '</span>' +
            '</button>'
          ).join("") +
        '</div>' + ending;

      scene.querySelectorAll("[data-choice]").forEach(button => {
        button.addEventListener("click", () => {
          const choice = result.choices[Number(button.dataset.choice)];
          history.push(snapshot());
          if (choice.setter) execute(choice.setter);
          render(choice.destination, true, true);
          window.scrollTo({ top: 0, behavior: "smooth" });
          save();
        });
      });

      backButton.disabled = history.length === 0;
      document.title = cleanTitle(name) + " — The Game";
    }

    function startFresh() {
      state = {};
      visits = {};
      history = [];
      processPassage("StoryInit", true);
      render("Start", true, true);
      save();
    }

    backButton.addEventListener("click", () => {
      const previous = history.pop();
      if (!previous) return;
      state = previous.state;
      visits = previous.visits;
      render(previous.passage, false, false);
      window.scrollTo({ top: 0, behavior: "smooth" });
      save();
    });

    restartButton.addEventListener("click", () => {
      if (currentPassage === "Start" || confirm("Начать историю заново? Текущий прогресс будет сброшен.")) {
        startFresh();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (saved?.currentPassage && passages[saved.currentPassage]) {
        currentPassage = saved.currentPassage;
        state = saved.state || {};
        visits = saved.visits || {};
        history = saved.history || [];
        render(currentPassage, false, false);
      } else {
        startFresh();
      }
    } catch {
      startFresh();
    }
  </script>
</body>
</html>
