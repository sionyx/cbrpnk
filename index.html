<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <title>The Game — первая сессия</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b0d;
      --panel: rgba(14, 22, 25, 0.94);
      --panel-strong: #111b1f;
      --text: #e7efed;
      --muted: #8ea09d;
      --line: rgba(116, 255, 222, 0.16);
      --accent: #71f6d2;
      --accent-2: #d7ff66;
      --danger: #ff6f75;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 0%, rgba(65, 184, 158, 0.11), transparent 34rem),
        radial-gradient(circle at 100% 85%, rgba(215, 255, 102, 0.05), transparent 32rem),
        linear-gradient(180deg, #090f11 0%, var(--bg) 72%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.62;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      opacity: 0.28;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 100% 4px;
    }

    button { font: inherit; }

    .shell {
      width: min(100%, 780px);
      min-height: 100svh;
      margin: 0 auto;
      padding:
        max(14px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -14px -4px 28px;
      padding: max(14px, env(safe-area-inset-top)) 4px 10px;
      background: linear-gradient(180deg, rgba(7, 11, 13, .98) 55%, rgba(7, 11, 13, 0));
    }

    .brand {
      color: var(--accent);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .tools { display: flex; gap: 6px; }

    .tool {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .tool:hover, .tool:focus-visible {
      border-color: var(--line);
      color: var(--text);
      outline: none;
    }

    .tool:disabled { visibility: hidden; }

    .scene {
      animation: appear 280ms ease-out both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 24px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 24px;
      height: 2px;
      content: "";
      background: var(--accent-2);
      box-shadow: 0 0 12px rgba(215, 255, 102, .5);
    }

    h1 {
      max-width: 18ch;
      margin: 0 0 26px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 9vw, 3.55rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.03;
      text-wrap: balance;
    }

    .copy {
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.08rem, 4.8vw, 1.28rem);
      line-height: 1.68;
    }

    .copy p { margin: 0 0 1.15em; }

    .narration.copy p:first-child::first-letter {
      float: left;
      margin: .09em .11em 0 0;
      color: var(--accent);
      font-size: 3.25em;
      font-weight: 700;
      line-height: .72;
    }

    .copy ul {
      margin: 0 0 1.25em;
      padding-left: 1.25em;
    }

    .copy li { margin: .45em 0; padding-left: .25em; }
    .copy li::marker { color: var(--accent); }

    .copy strong { color: #fff; }

    .narration {
      width: 100%;
      margin-bottom: 24px;
      text-align: justify;
      text-justify: inter-word;
    }

    .narration:empty { display: none; }

    .dialogue {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: start;
      gap: 14px;
    }

    .dialogue.without-avatar { display: block; }

    .speaker-name {
      margin: 0 0 8px;
      color: #fff;
      font-size: .84rem;
      font-weight: 800;
      letter-spacing: .08em;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .avatar {
      position: sticky;
      top: 76px;
      width: 64px;
      height: 64px;
      border: 1px solid rgba(113, 246, 210, .38);
      border-radius: 16px;
      background: var(--panel-strong);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .32);
      object-fit: cover;
    }

    .copy code {
      padding: .12em .35em;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: rgba(113, 246, 210, .06);
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .78em;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: clamp(32px, 8vh, 72px);
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .choice {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      width: 100%;
      min-height: 66px;
      align-items: center;
      gap: 20px;
      padding: 17px 18px;
      border: 1px solid rgba(113, 246, 210, .22);
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(20, 34, 37, .97), rgba(12, 20, 23, .97));
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
      color: var(--text);
      cursor: pointer;
      font-size: .98rem;
      font-weight: 680;
      line-height: 1.32;
      text-align: left;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .choice::after {
      content: "→";
      color: var(--accent);
      font-size: 1.35rem;
      font-weight: 400;
    }

    .choice:hover, .choice:focus-visible {
      border-color: rgba(113, 246, 210, .65);
      background: linear-gradient(135deg, rgba(26, 46, 48, .98), rgba(15, 27, 29, .98));
      outline: none;
      transform: translateY(-1px);
    }

    .choice:active { transform: translateY(1px) scale(.995); }

    .ending {
      margin-top: 42px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      color: var(--muted);
      text-align: center;
    }

    .error { color: var(--danger); }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 720px) {
      .shell { padding-inline: 36px; }
      .dialogue { grid-template-columns: 88px minmax(0, 1fr); gap: 20px; }
      .avatar { width: 88px; height: 88px; border-radius: 20px; }
      .choices.multiple { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choices.multiple .choice:last-child:nth-child(odd) { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>

 null>>\n<<set $michaelLearnedPrecinctBallisticsFact = null>>\n<<set $michaelPrecinctBallisticsDie1 = null>>\n<<set $michaelPrecinctBallisticsDie2 = null>>\n<<set $michaelPrecinctBallisticsDie3 = null>>\n<<set $michaelPrecinctBallisticsCheckTotal = null>>\n<<set $teamKnowsPrecinctBallisticsFact = false>>\n<<set $tahiLearnedPrecinctBallisticsFact = null>>\n<<set $tahiPrecinctBallisticsDie1 = null>>\n<<set $tahiPrecinctBallisticsDie2 = null>>\n<<set $tahiPrecinctBallisticsDie3 = null>>\n<<set $tahiPrecinctBallisticsCheckTotal = null>>\n<<set $teamKnowsTahiPrecinctBallisticsFact = false>>\n<<set $precinctResolvedOffscreen = false>>\n<<set $theoAttemptedSecretPrecinctDeparture = null>>\n<<set $theoStayedWithTeamAtPrecinct = null>>\n<<set $theoUnlockedPrecinctMotorcycle = null>>\n<<set $theoPrecinctMotorcycleDie1 = null>>\n<<set $theoPrecinctMotorcycleDie2 = null>>\n<<set $theoPrecinctMotorcycleDie3 = null>>\n<<set $theoPrecinctMotorcycleCheckTotal = null>>\n<<set $theoVisitedPsyOps = false>>\n<<set $hasDamagedPrecinctDrive = false>>\n<<set $shorokhRecognizedRepairablePrecinctDrive = null>>\n<<set $shorokhPrecinctDriveDie1 = null>>\n<<set $shorokhPrecinctDriveDie2 = null>>\n<<set $shorokhPrecinctDriveDie3 = null>>\n<<set $shorokhPrecinctDriveCheckTotal = null>>\n<<set $michaelFoundExternalCamera = null>>\n<<set $michaelCameraSearchDie1 = null>>\n<<set $michaelCameraSearchDie2 = null>>\n<<set $michaelCameraSearchDie3 = null>>\n<<set $michaelCameraSearchTotal = null>>\n<<set $michaelRetrievedExternalCamera = null>>\n<<set $michaelCameraClimbDie1 = null>>\n<<set $michaelCameraClimbDie2 = null>>\n<<set $michaelCameraClimbDie3 = null>>\n<<set $michaelCameraClimbTotal = null>>\n<<set $shorokhHasExternalCameraDrive = false>>\n<<set $externalCameraHasAttackRecording = false>>\n<<set $shorokhRememberedRobotInfo = null>>\n<<set $shorokhRobotDie1 = null>>\n<<set $shorokhRobotDie2 = null>>\n<<set $shorokhRobotDie3 = null>>\n<<set $shorokhRobotCheckTotal = null>>\n<<set $theoNeutralizedPsyOpsRobots = false>>\n<<set $sweetJohnnyRescued = false>>\n<<set $theoLeftSweetJohnny = false>>\n<<set $shorokhKnowsSweetJohnny = false>>\n<<set $shorokhKnowsTheoVisitedPsyOps = false>>\n<<set $teamKnowsTheoVisitedPsyOps = false>>\n<<set $fullTeamCyberpsychoBattle = false>>\n<<set $knowsStadiumPlan = false>>\n<<set $teamReunitedForStadium = false>>\n\n","Start":"Даллас, вторая половина XXI века. Высотная застройка не пропускает прямой солнечный свет к нижним улицам Blue Skyport, и даже утро здесь похоже на затянувшуюся ночь.\n\nВ 08:00 пятеро полицейских заступают на смену, которая приведёт их к исчезнувшему участку, корпоративному заговору и стадиону Detroit Rangers.\n\nВыберите персонажа, за которого пройдёте эту историю:\n\n[[Познакомиться с Шорохом->P01 — Михаил «Шорох» Вельский]]\n[[Познакомиться с Майклом->P02 — Майкл Маклейн]]\n[[Познакомиться с Тахи->P03 — Тахи]]\n[[Познакомиться с Тео->P04 — Тео Маклейн]]\n[[Познакомиться с Рил->P05 — RE-L «Рил»]]\n\n","P01 — Михаил «Шорох» Вельский":"Михаил «Шорох» Вельский — полицейский техник, который чувствует радиоволны кожей, видит ток в цепях и разговаривает с машинами как с живыми. Его киберрука способна вскрыть почти любой корпус, а интуиция находит сигналы, которых не замечают другие.\n\nШорох силён в работе с электроникой и нестандартными загадками, но слаб в прямом столкновении. Он добродушен, непредсказуем и не всегда отличает точное воспоминание от красивой версии. Выбирая его, придётся решать, каким ощущениям можно доверять.\n\n**Шорох**\n\n— У каждой машины есть характер. Слушать надо внимательнее.\n\n[[Выбрать->S01 — 08:00. Одиннадцатый участок][$selectedCharacter = \"shorokh\"]]\n[[Назад->Start]]\n\n","P02 — Майкл Маклейн":"Майкл Маклейн — пятидесятидвухлетний ветеран, кочевник и наёмник старой школы. Он немногословен, предпочитает классическое оружие и привык полагаться на себя. Потерянную на войне правую руку заменяет тяжёлый механический протез.\n\nМайкл вынослив, силён и умеет действовать под давлением, но плохо доверяет корпорациям и современной технике. В команде рядом с ним служит дочь Тео, которую он пытается защитить от опасного города — даже когда его забота становится для неё клеткой.\n\n**Майкл Маклейн**\n\n— Сначала вытащим своих. Потом разберёмся, кто за это заплатит.\n\n[[Выбрать->S01 — 08:00. Одиннадцатый участок][$selectedCharacter = \"michael\"]]\n[[Назад->Start]]\n\n","P03 — Тахи":"Тахи — потомок племени мохаве, бывший боец специального подразделения и специалист практически по любому оружию. После службы он искал спокойную законную работу и оказался рядовым полицейским в одиннадцатом участке Далласа.\n\nТахи хладнокровен, дисциплинирован и лучше других сохраняет самообладание, когда всё рушится. Его путь подойдёт тем, кто предпочитает тактику, оружие и твёрдые решения. О прежней службе он говорит мало, а название подразделения не называет вовсе.\n\n**Тахи**\n\n— Духи могут предупреждать. Но оружие всё равно нужно проверить самому.\n\n[[Выбрать->S01 — 08:00. Одиннадцатый участок][$selectedCharacter = \"tahi\"]]\n[[Назад->Start]]\n\n","P04 — Тео Маклейн":"Тео Маклейн — семнадцатилетняя начинающая наёмница из клана «Змеиный народ». Отец учил её стрелять с детства, и со снайперской винтовкой она быстрее и точнее многих взрослых. Но на настоящих заданиях Майкл по-прежнему держит её в стороне от опасности.\n\nТео хочет доказать, что способна решать сама. Втайне от отца она установила простой имплант и учится взламывать технику. Её история — о риске, независимости и секретах, которые приходится хранить даже от самых близких.\n\n**Тео**\n\n— Если мне никогда не доверят настоящее дело, я возьму его сама.\n\n[[Выбрать->S01 — 08:00. Одиннадцатый участок][$selectedCharacter = \"theo\"]]\n[[Назад->Start]]\n\n","P05 — RE-L «Рил»":"RE-L — корпоративное обозначение: «разведка и ликвидация, дальнобойная серия». Настоящего имени Рил не помнит. Arasaka вырастила её как оружие, а импланты ORACLE и BLINDZONE позволяют видеть цели за стенами и стрелять туда, где противник окажется через мгновение.\n\nРил тиха, точна и смертельно эффективна, но её организм плохо переносит ранения и перегрузку. За холодной дисциплиной скрываются любопытство, сухой сарказм и вопросы, которым корпорация не учила. Этот путь — для тех, кто готов обменять выносливость на контроль и огромную силу первого удара.\n\n**Рил**\n\n— Я вижу, куда вы пойдёте. Не всегда понимаю зачем.\n\n[[Выбрать->S01 — 08:00. Одиннадцатый участок][$selectedCharacter = \"reL\"]]\n[[Назад->Start]]\n\n","S01 — 08:00. Одиннадцатый участок":"<<set $gameHour = 8>>\n*08:00. Ночная смена покидает обветшавший одиннадцатый участок. В проводке потрескивают искры, из кофейного автомата пахнет соей. За стойкой Ричи Хартман отрывается от старого компьютера.*\n\n**Сержант Ричи Хартман**\n\n— Доброе утро. Шеф уже здесь и сегодня явно не в духе. Берите кофе и садитесь — сейчас начнёт инструктаж.\n\n//Стенограмма: 00:00–03:13.//\n\n[[Дальше →->S02 — Вводная Дойла]]\n\n","S02 — Вводная Дойла":"*Кристиан Дойл спускается к команде, долго молчит и хмуро оглядывает собравшихся.*\n\n**Шеф Кристиан Дойл**\n\n— Кажется, ночь прошла не совсем гладко. Патруль девятого участка столкнулся с Потрошителями. Троих бандитов застрелили, ещё нескольких задержали и отвезли в участок. После трёх часов — тишина. Даже Аарон Буч не отвечает.\n\n— Во время патруля заскочите туда и выясните, что произошло. И ещё: по району разъезжают какие-то чёрные фургоны. Узнайте, кто они. Скоро приезжает окружной прокурор, поэтому проведите смену тихо. Если начнётся стрельба — не лезьте и сразу докладывайте мне. Я ясно выразился?\n\n[[Дальше →->S03 — Личные сигналы тревоги]]\n\n","S03 — Личные сигналы тревоги":"<<if $selectedCharacter is \"tahi\">>\n*В тишине на КПК вспыхивает имя, которого Тахи давно не видел.*\n\n**Тахи**\n\n— Большой Бо?.. Странно, что он вообще меня помнит. И ещё страннее, что звонит во время смены.\n<<elseif $selectedCharacter is \"theo\">>\n*Тео снова открывает оборвавшуюся ночную переписку.*\n\n**Тео**\n\n— Два часа ночи. Последнее сообщение — посреди разговора. Для Джони ночь всегда была рабочим временем... Он бы не исчез просто так.\n<<elseif $selectedCharacter is \"michael\">>\n*Майкл замечает, как Тео прячет экран КПК, едва встречается с ним взглядом.*\n\n**Майкл Маклейн**\n\n— Что-то с ней не так. Опять сделает вид, что всё нормально, и ничего не скажет.\n<<elseif $selectedCharacter is \"reL\">>\n*Имя нового шефа десятого участка цепляется за обрывок корпоративной памяти.*\n\n**Рил**\n\n— Джонатан Лайт. Я встречала эту фамилию рядом с «Крион», но не помню, в каком контексте.\n<<else>>\n*Слова Дойла о пропавших данных и незнакомых машинах неприятно отзываются в импланте Шороха.*\n\n**Шорох**\n\n— Девятый участок молчит, по району ездят чёрные фургоны... Слишком много странных сигналов для одного спокойного утра.\n<<endif>>\n\n[[Дальше →->S04 — Расспросы Ричи]]\n\n","S04 — Расспросы Ричи":"*Дойл возвращается в кабинет. Ричи быстро перебирает окна полицейской сети и бормочет себе под нос.*\n\n**Сержант Ричи Хартман**\n\n— После трёх ночи от девятого — ни одного сообщения. Даже обязательного отчёта Буча нет. Это уже не похоже на обычный сбой.\n\n[[Поговорить с сержантом Ричи->U46 — Разговор с Ричи]]\n[[Не отвлекать Ричи->S04B — Оставшееся время до выезда]]\n\n","U46 — Разговор с Ричи":"<<set $talkedToRichie = true>>\n<<set $teamKnowsRichiePrecinctDetails = true>>\n*Выбранный герой подходит к столу и спрашивает о ночной заварушке. Ричи разворачивает к нему монитор.*\n\n**Сержант Ричи Хартман**\n\n— Последнее донесение такое: патруль увидел Потрошителей, те начали бросаться бутылками, а потом первыми открыли огонь. Троих положили, одного или двух взяли и привезли в девятый. После этого — тишина. Ни сообщений патрульных, ни утреннего отчёта Аарона Буча.\n\n— Записи камер должны храниться у них локально. Отсюда я их не открою — даже Шорох не откроет, если доступ закрыт с той стороны. А десятый участок работает как обычно. Молчит только девятый.\n\n[[Завершить разговор->S04B — Оставшееся время до выезда]]\n\n","S04B — Оставшееся время до выезда":"<<if $selectedCharacter is \"shorokh\">>\n**Шорох**\n\n— До выезда ещё есть время. Можно сунуться в полицейскую сеть и поискать следы удалённых сообщений. А можно не светить имплант и проверить всё на месте.\n\n[[Подключиться к полицейской сети->C23 — Проверка полицейской сети Шорохом][$shorokhTriedMorningPoliceNetwork = true]]\n[[Не рисковать удалённым подключением->C26 — Скрытое решение NPC-Майкла][$shorokhTriedMorningPoliceNetwork = false]]\n<<elseif $selectedCharacter is \"michael\">>\n**Майкл Маклейн**\n\n— Маркус был в ночном патруле. Если вспомню его номер, может, он скажет, что там произошло.\n\n[[Позвонить Маркусу->C27 — Проверка памяти Майкла]]\n[[Не звонить Маркусу->C24 — Скрытое решение NPC-Шороха][$michaelCalledNightPatrol = false]]\n<<elseif $selectedCharacter is \"theo\">>\n**Тео**\n\n— Джони всё ещё не в сети. Написать ещё раз или не привлекать внимание?\n\n[[Решить, писать ли Джони->C30 — Сообщение Тео Сладкому Джони]]\n<<elseif $selectedCharacter is \"tahi\">>\n**Тахи**\n\n— Большой Бо продолжает звонить. Если отвечу, придётся выслушать, зачем я внезапно понадобился племени.\n\n[[Решить, отвечать ли на звонок->C31 — Входящий звонок Большого Бо]]\n<<else>>\n**Рил**\n\n— До выезда осталось немного времени. Проверю снаряжение и понаблюдаю за остальными.\n\n[[Дальше →->C24 — Скрытое решение NPC-Шороха]]\n<<endif>>\n\n","C30 — Сообщение Тео Сладкому Джони":"*На экране КПК всё ещё открыта оборвавшаяся переписка.*\n\n**Тео**\n\n— Джони не появлялся с двух ночи. Попробовать ещё раз?\n\n### Написать Джони?\n\n[[Да — спросить, всё ли с ним в порядке->U57 — Тео написала Джони]]\n[[Нет — убрать КПК->U58 — Тео не стала писать Джони]]\n\n","U57 — Тео написала Джони":"<<set $theoChoseMorningMessageJohnny = true>>\n<<set $theoMorningMessageJohnnyAnswered = false>>\n*Тео отправляет сообщение. Статус доставки не меняется.*\n\n**Тео**\n\n— Джони, ты там? Всё в порядке?.. Чёрт. Опять ничего.\n\n[[Дальше →->C24 — Скрытое решение NPC-Шороха]]\n\n","U58 — Тео не стала писать Джони":"<<set $theoChoseMorningMessageJohnny = false>>\n*Тео гасит экран КПК.*\n\n**Тео**\n\n— Не сейчас. Сначала нужно понять, что происходит в городе.\n\n[[Дальше →->C24 — Скрытое решение NPC-Шороха]]\n\n","C31 — Входящий звонок Большого Бо":"*На экране КПК высвечивается имя Большого Бо.*\n\n**Тахи**\n\n— Столько лет молчал — и решил позвонить именно сегодня.\n\n### Ответить на звонок?\n\n[[Принять звонок->U59 — Тахи поговорил с Большим Бо]]\n[[Отклонить звонок->U60 — Тахи не ответил Большому Бо]]\n\n","U59 — Тахи поговорил с Большим Бо":"<<set $tahiAnsweredMorningBigBoCall = true>>\n<<set $tahiKnowsBigBoMeeting = true>>\n<<set $tahiSharedMorningBigBoCall = true>>\n<<set $teamKnowsBigBoMeeting = true>>\n*На экране появляется грузное лицо мужчины с длинной чёрной косой и в безупречной белой рубашке.*\n\n**Большой Бо**\n\n— Тахи! Я уж думал, с тобой что-то стряслось. Мы всё равно одной крови, одного племени. Поэтому я могу доверять тебе как себе. Заскочи ко мне в ближайшие пару часов — обязательно до одиннадцати. Вопрос касается всего района.\n\n— Я буду в пентхаусе «Парадизо». Хочешь — приезжай один. Доверяешь сослуживцам — бери их с собой.\n\n[[Дальше →->D05 — Тахи рассказывает о звонке Большого Бо]]\n\n","D05 — Тахи рассказывает о звонке Большого Бо":"*После звонка Тахи поворачивается к остальным.*\n\n**Тахи**\n\n— Это был Большой Бо. Ждёт нас в «Парадизо» до одиннадцати. Говорит, дело касается всего района. Можем заехать всей командой.\n\n[[Дальше →->C24 — Скрытое решение NPC-Шороха]]\n\n","U60 — Тахи не ответил Большому Бо":"<<set $tahiAnsweredMorningBigBoCall = false>>\n<<set $tahiKnowsBigBoMeeting = false>>\n<<set $tahiSharedMorningBigBoCall = false>>\n<<set $teamKnowsBigBoMeeting = false>>\n*Тахи отклоняет вызов.*\n\n**Тахи**\n\n— Если дело действительно важное, ему придётся найти другой способ. Сейчас у меня смена.\n\n[[Дальше →->C24 — Скрытое решение NPC-Шороха]]\n\n","C24 — Скрытое решение NPC-Шороха":"<<silently>>\n<<if $shorokhMorningPoliceNetworkDecisionRoll is null>>\n<<set $shorokhMorningPoliceNetworkDecisionRoll = random(1, 100)>>\n<<endif>>\n\n<<if $shorokhMorningPoliceNetworkDecisionRoll <= 80>>\n<<set $shorokhTriedMorningPoliceNetwork = true>>\n<<if $shorokhMorningPoliceNetworkTotal is null>>\n<<set $shorokhMorningPoliceNetworkDie1 = random(1, 6)>>\n<<set $shorokhMorningPoliceNetworkDie2 = random(1, 6)>>\n<<set $shorokhMorningPoliceNetworkDie3 = random(1, 6)>>\n<<set $shorokhMorningPoliceNetworkTotal = $shorokhMorningPoliceNetworkDie1 + $shorokhMorningPoliceNetworkDie2 + $shorokhMorningPoliceNetworkDie3 + 3>>\n<<endif>>\n<<if $shorokhMorningPoliceNetworkTotal >= 11>>\n<<set $shorokhMorningPoliceNetworkSucceeded = true>>\n<<set $shorokhKnowsPoliceDataDeleted = true>>\n<<else>>\n<<set $shorokhMorningPoliceNetworkSucceeded = false>>\n<<set $shorokhKnowsPoliceDataDeleted = false>>\n<<endif>>\n<<else>>\n<<set $shorokhTriedMorningPoliceNetwork = false>>\n<<endif>>\n<</silently>>\n\n*Пока выбранный герой занят своими делами, поступок NPC-Шороха и его возможная проверка разрешаются скрыто.*\n\n[[Дальше →->C26 — Скрытое решение NPC-Майкла]]\n\n","C23 — Проверка полицейской сети Шорохом":"<<if $shorokhMorningPoliceNetworkTotal is null>>\n<<set $shorokhMorningPoliceNetworkDie1 = random(1, 6)>>\n<<set $shorokhMorningPoliceNetworkDie2 = random(1, 6)>>\n<<set $shorokhMorningPoliceNetworkDie3 = random(1, 6)>>\n<<set $shorokhMorningPoliceNetworkTotal = $shorokhMorningPoliceNetworkDie1 + $shorokhMorningPoliceNetworkDie2 + $shorokhMorningPoliceNetworkDie3 + 3>>\n<<endif>>\n\n*Шорох подключает к рабочему терминалу киберруку.*\n\n**Шорох**\n\n— Самих сообщений может уже не быть. Но если их подчистили, в сети должен остаться хвост.\n\n**Проверка Интеллекта:** `3d6 + 3` против сложности 11.\n\nКубики: **$shorokhMorningPoliceNetworkDie1**, **$shorokhMorningPoliceNetworkDie2**, **$shorokhMorningPoliceNetworkDie3**. Интеллект Шороха: **+3**. Итог: **$shorokhMorningPoliceNetworkTotal**.\n\n<<if $shorokhMorningPoliceNetworkTotal >= 11>>\n<<set $shorokhMorningPoliceNetworkSucceeded = true>>\n[[Изучить найденные следы->U47 — Шорох обнаружил удаление данных]]\n<<else>>\n<<set $shorokhMorningPoliceNetworkSucceeded = false>>\n[[Отключиться от сети->U48 — Шорох ничего не узнал о сети]]\n<<endif>>\n\n","U47 — Шорох обнаружил удаление данных":"<<set $shorokhKnowsPoliceDataDeleted = true>>\n*На пустом канале проступают остаточные следы зачистки.*\n\n**Шорох**\n\n— Вот оно. Канал не пустой — его вычистили. Кто-то удалил сообщения девятого участка намеренно. Содержимое уже не вернуть, но следы остались.\n\n[[Решить, сообщать ли об этом команде->C25 — Решение Шороха о раскрытии удаления]]\n\n","C25 — Решение Шороха о раскрытии удаления":"**Шорох**\n\n— Рассказать остальным о зачистке или пока оставить это при себе?\n\n[[Рассказать команде перед выездом->U49 — Шорох рассказал об удалении данных]]\n[[Сохранить обнаруженный факт при себе->U50 — Шорох скрыл удаление данных]]\n\n","U49 — Шорох рассказал об удалении данных":"<<set $shorokhSharedMorningPoliceDataDeleted = true>>\n<<set $teamKnowsPoliceDataDeleted = true>>\n*Шорох отключается от терминала и обращается к команде.*\n\n**Шорох**\n\n— В девятом участке не просто перестали передавать данные. Их кто-то сознательно удалил. Следы зачистки остались, но вытащить сами сообщения я не смог.\n\n[[Дальше →->C26 — Скрытое решение NPC-Майкла]]\n\n","U50 — Шорох скрыл удаление данных":"<<set $shorokhSharedMorningPoliceDataDeleted = false>>\n<<set $teamKnowsPoliceDataDeleted = false>>\n*Шорох отключается от терминала, не привлекая внимания.*\n\n**Шорох**\n\n— Сначала посмотрю на участок своими глазами. Про зачистку остальным пока знать не обязательно.\n\n[[Дальше →->C26 — Скрытое решение NPC-Майкла]]\n\n","U48 — Шорох ничего не узнал о сети":"<<set $shorokhKnowsPoliceDataDeleted = false>>\n*Сеть отвечает бессвязным шумом.*\n\n**Шорох**\n\n— Ничего. Ни сообщений, ни понятных следов. Придётся разбираться на месте.\n\n[[Дальше →->C26 — Скрытое решение NPC-Майкла]]\n\n","C26 — Скрытое решение NPC-Майкла":"<<silently>>\n<<if $selectedCharacter isnot \"michael\">>\n<<set $michaelKnowsNightPatrolPhone = true>>\n<<if $michaelMorningCallDecisionRoll is null>>\n<<set $michaelMorningCallDecisionRoll = random(1, 100)>>\n<<endif>>\n<<if $michaelMorningCallDecisionRoll <= 80>>\n<<set $michaelCalledNightPatrol = true>>\n<<set $michaelNightPatrolAnswered = false>>\n<<else>>\n<<set $michaelCalledNightPatrol = false>>\n<<endif>>\n<<endif>>\n<</silently>>\n\n*Решение NPC-Майкла о звонке знакомому из ночного патруля определяется скрыто.*\n\n[[Дальше →->C29 — Сообщение Рил от Джонатана Лайта]]\n\n","C27 — Проверка памяти Майкла":"<<if $michaelMorningPhoneRecallTotal is null>>\n<<set $michaelMorningPhoneRecallDie1 = random(1, 6)>>\n<<set $michaelMorningPhoneRecallDie2 = random(1, 6)>>\n<<set $michaelMorningPhoneRecallDie3 = random(1, 6)>>\n<<set $michaelMorningPhoneRecallTotal = $michaelMorningPhoneRecallDie1 + $michaelMorningPhoneRecallDie2 + $michaelMorningPhoneRecallDie3 + 1>>\n<<endif>>\n\n**Майкл Маклейн**\n\n— Номер был старый... Я его точно помнил. Осталось вытащить из головы.\n\n**Проверка Интеллекта:** `3d6 + 1` против сложности 11.\n\nКубики: **$michaelMorningPhoneRecallDie1**, **$michaelMorningPhoneRecallDie2**, **$michaelMorningPhoneRecallDie3**. Интеллект Майкла: **+1**. Итог: **$michaelMorningPhoneRecallTotal**.\n\n<<if $michaelMorningPhoneRecallTotal >= 11>>\n[[Дальше →->U51 — Майкл позвонил Маркусу]]\n<<else>>\n[[Дальше →->U52 — Майкл не вспомнил номер]]\n<<endif>>\n\n","U51 — Майкл позвонил Маркусу":"<<set $michaelKnowsNightPatrolPhone = true>>\n<<set $michaelCalledNightPatrol = true>>\n<<set $michaelNightPatrolAnswered = false>>\n*После нескольких длинных гудков включается тишина.*\n\n**Майкл Маклейн**\n\n— Маркус? Это Майкл... Чёрт. Не отвечает.\n\n[[Дальше →->C33 — Знакомое имя Сладкого Джони]]\n\n","U52 — Майкл не вспомнил номер":"<<set $michaelKnowsNightPatrolPhone = false>>\n<<set $michaelCalledNightPatrol = false>>\n**Майкл Маклейн**\n\n— Бесполезно. Помню лицо, помню голос, а номер — нет.\n\n[[Дальше →->C24 — Скрытое решение NPC-Шороха]]\n\n","C28 — Решение Майкла о раскрытии звонка":"**Майкл Маклейн**\n\n— Сказать остальным, что Маркус не отвечает, или не поднимать тревогу раньше времени?\n\n[[Рассказать команде перед выездом->U53 — Майкл рассказал о звонке]]\n[[Сохранить безответный звонок при себе->U54 — Майкл скрыл звонок]]\n\n","U53 — Майкл рассказал о звонке":"<<set $michaelSharedNightPatrolDidNotAnswer = true>>\n<<set $teamKnowsNightPatrolDidNotAnswer = true>>\n*Майкл убирает телефон и обращается к остальным.*\n\n**Майкл Маклейн**\n\n— Я звонил Маркусу из ночного патруля. Номер вспомнил, но он не ответил.\n\n[[Дальше →->C24 — Скрытое решение NPC-Шороха]]\n\n","U54 — Майкл скрыл звонок":"<<set $michaelSharedNightPatrolDidNotAnswer = false>>\n<<set $teamKnowsNightPatrolDidNotAnswer = false>>\n**Майкл Маклейн**\n\n— Пока промолчу. Один пропущенный звонок ещё ничего не доказывает.\n\n[[Дальше →->C24 — Скрытое решение NPC-Шороха]]\n\n","C33 — Знакомое имя Сладкого Джони":"<<set $michaelNoticedTheoJohnnyMessage = true>>\n<<if $michaelJohnnyNameCheckTotal is null>>\n<<set $michaelJohnnyNameDie1 = random(1, 6)>>\n<<set $michaelJohnnyNameDie2 = random(1, 6)>>\n<<set $michaelJohnnyNameDie3 = random(1, 6)>>\n<<set $michaelJohnnyNameCheckTotal = $michaelJohnnyNameDie1 + $michaelJohnnyNameDie2 + $michaelJohnnyNameDie3 + 1>>\n<<endif>>\n\n*Закончив звонок, Майкл замечает вспыхнувший экран КПК Тео. В открытой переписке видно старое сообщение от Сладкого Джони.*\n\n**Майкл Маклейн**\n\n— Сладкий Джони... Где я уже видел это имя?\n\n**Проверка Интеллекта:** `3d6 + 1` против сложности 11.\n\nКубики: **$michaelJohnnyNameDie1**, **$michaelJohnnyNameDie2**, **$michaelJohnnyNameDie3**. Интеллект Майкла: **+1**. Итог: **$michaelJohnnyNameCheckTotal**.\n\n<<if $michaelJohnnyNameCheckTotal >= 11>>\n[[Вспомнить имя->U61 — Майкл узнал имя Джони]]\n<<else>>\n[[Не вспомнить имя->U62 — Майкл не узнал имя Джони]]\n<<endif>>\n\n","U61 — Майкл узнал имя Джони":"<<set $michaelRecognizedJohnnyName = true>>\n**Майкл Маклейн**\n\n— Точно. Я уже видел его сообщения у Тео. Там ещё мелькало название PsyOps. Всё собирался проверить эту контору — и так и не проверил.\n\n//Связка «Сладкий Джони — Тео — PsyOps» остаётся личным знанием Майкла. В текущем графе она ни на что не влияет; отдельная сцена для её применения пока отсутствует и, возможно, появится во второй части.//\n\n[[Решить, сообщать ли о звонке Маркусу->C28 — Решение Майкла о раскрытии звонка]]\n\n","U62 — Майкл не узнал имя Джони":"<<set $michaelRecognizedJohnnyName = false>>\n**Майкл Маклейн**\n\n— Нет. Имя ни о чём не говорит. Наверное, очередной знакомый Тео.\n\n[[Решить, сообщать ли о звонке Маркусу->C28 — Решение Майкла о раскрытии звонка]]\n\n","C29 — Сообщение Рил от Джонатана Лайта":"<<set $reLReceivedMorningLightMessage = true>>\n<<if $selectedCharacter is \"reL\">>\n*Перед самым выездом наручный пейджер коротко вибрирует. Отправитель — Джонатан Лайт. Содержание сообщения пока не определено.*\n\n**Рил**\n\n— Лайт написал напрямую мне. Рассказать остальным или сначала понять, чего он хочет?\n\n[[Рассказать команде о сообщении->U55 — Рил раскрыла сообщение Лайта]]\n[[Скрыть полученную информацию->U56 — Рил скрыла сообщение Лайта]]\n<<else>>\n<<silently>>\n<<if $reLMorningLightDisclosureRoll is null>>\n<<set $reLMorningLightDisclosureRoll = random(1, 100)>>\n<<endif>>\n<<if $reLMorningLightDisclosureRoll <= 20>>\n<<set $reLSharedMorningLightMessage = true>>\n<<set $teamKnowsMorningLightMessage = true>>\n<<else>>\n<<set $reLSharedMorningLightMessage = false>>\n<<set $teamKnowsMorningLightMessage = false>>\n<<endif>>\n<</silently>>\n*Личное решение NPC-Рил о сообщении Джонатана Лайта разрешается скрыто.*\n\n[[Дальше →->C32 — Скрытое решение NPC-Тахи о звонке Большого Бо]]\n<<endif>>\n\n","U55 — Рил раскрыла сообщение Лайта":"<<set $reLSharedMorningLightMessage = true>>\n<<set $teamKnowsMorningLightMessage = true>>\n*Рил показывает остальным экран наручного пейджера.*\n\n**Рил**\n\n— Это сообщение прислал Джонатан Лайт. Здесь сказано следующее...\n\n//Заглушка: содержание сообщения может раскрыться во второй офлайн-сессии либо будет отдельно придумано позднее.//\n\n[[Дальше →->C32 — Скрытое решение NPC-Тахи о звонке Большого Бо]]\n\n","U56 — Рил скрыла сообщение Лайта":"<<set $reLSharedMorningLightMessage = false>>\n<<set $teamKnowsMorningLightMessage = false>>\n*Рил гасит экран пейджера.*\n\n**Рил**\n\n— Сначала проверю сведения сама. Команде пока знать об этом не нужно.\n\n[[Дальше →->C32 — Скрытое решение NPC-Тахи о звонке Большого Бо]]\n\n","C32 — Скрытое решение NPC-Тахи о звонке Большого Бо":"<<silently>>\n<<if $selectedCharacter isnot \"tahi\">>\n<<set $tahiAnsweredMorningBigBoCall = true>>\n<<set $tahiKnowsBigBoMeeting = true>>\n<<if $tahiMorningBigBoDisclosureRoll is null>>\n<<set $tahiMorningBigBoDisclosureRoll = random(1, 100)>>\n<<endif>>\n<<if $tahiMorningBigBoDisclosureRoll <= 80>>\n<<set $tahiSharedMorningBigBoCall = true>>\n<<set $teamKnowsBigBoMeeting = true>>\n<<else>>\n<<set $tahiSharedMorningBigBoCall = false>>\n<<set $teamKnowsBigBoMeeting = false>>\n<<endif>>\n<<endif>>\n<</silently>>\n\n*Звонок NPC-Тахи и его решение рассказать о приглашении разрешаются скрыто.*\n\n[[Дальше →->S05 — 09:00. Выезд]]\n\n","S05 — 09:00. Выезд":"<<set $gameHour = 9>>\n*У входа ждёт старая патрульная машина. Тахи занимает водительское место, Рил садится рядом, остальные устраиваются сзади у выдвижного терминала.*\n\n**Тахи**\n\n— Все внутри? Тогда закрывайте двери. Через минуту выезжаем.\n\n<<if $selectedCharacter isnot \"shorokh\" and $shorokhKnowsPoliceDataDeleted>>\n[[Дальше →->D01 — Утренняя новость Шороха]]\n<<elseif $selectedCharacter isnot \"michael\" and $michaelCalledNightPatrol>>\n[[Дальше →->D02 — Утренняя новость Майкла]]\n<<elseif $reLSharedMorningLightMessage and $selectedCharacter isnot \"reL\">>\n[[Дальше →->D03 — Утренняя новость Рил]]\n<<elseif $selectedCharacter isnot \"tahi\" and $tahiSharedMorningBigBoCall>>\n[[Дальше →->D04 — Утренняя новость Тахи]]\n<<else>>\n[[Дальше →->S06 — Выбор по пути к участку]]\n<<endif>>\n\n","D01 — Утренняя новость Шороха":"<<set $teamKnowsPoliceDataDeleted = true>>\n*Перед выездом Шорох отрывается от терминала.*\n\n**Шорох**\n\n— В девятом участке не просто перестали передавать данные. Их кто-то сознательно удалил. Следы зачистки остались, но сами сообщения я вытащить не смог.\n\n<<if $selectedCharacter isnot \"michael\" and $michaelCalledNightPatrol>>\n[[Дальше →->D02 — Утренняя новость Майкла]]\n<<elseif $reLSharedMorningLightMessage and $selectedCharacter isnot \"reL\">>\n[[Дальше →->D03 — Утренняя новость Рил]]\n<<elseif $selectedCharacter isnot \"tahi\" and $tahiSharedMorningBigBoCall>>\n[[Дальше →->D04 — Утренняя новость Тахи]]\n<<else>>\n[[Дальше →->S06 — Выбор по пути к участку]]\n<<endif>>\n\n","D02 — Утренняя новость Майкла":"<<set $teamKnowsNightPatrolDidNotAnswer = true>>\n*Майкл убирает телефон.*\n\n**Майкл Маклейн**\n\n— Я звонил Маркусу из ночного патруля. Номер у меня был, но он не ответил.\n\n<<if $reLSharedMorningLightMessage and $selectedCharacter isnot \"reL\">>\n[[Дальше →->D03 — Утренняя новость Рил]]\n<<elseif $selectedCharacter isnot \"tahi\" and $tahiSharedMorningBigBoCall>>\n[[Дальше →->D04 — Утренняя новость Тахи]]\n<<else>>\n[[Дальше →->S06 — Выбор по пути к участку]]\n<<endif>>\n\n","D03 — Утренняя новость Рил":"*Рил показывает команде сообщение на наручном пейджере.*\n\n**Рил**\n\n— Это прислал Джонатан Лайт. Содержание сообщения пока не определено, но оно относится к нашей сегодняшней смене.\n\n//Заглушка: точные сведения и их последствия будут добавлены после отдельного уточнения.//\n\n<<if $selectedCharacter isnot \"tahi\" and $tahiSharedMorningBigBoCall>>\n[[Дальше →->D04 — Утренняя новость Тахи]]\n<<else>>\n[[Дальше →->S06 — Выбор по пути к участку]]\n<<endif>>\n\n","D04 — Утренняя новость Тахи":"**Тахи**\n\n— Мне звонил Большой Бо. Ждёт в «Парадизо» до одиннадцати. Говорит, дело касается всего района, и разрешил взять сослуживцев.\n\n[[Дальше →->S06 — Выбор по пути к участку]]\n\n","S06 — Выбор по пути к участку":"*Под многоярусными зданиями всё ещё царит полумрак. Дорога почти пуста, магазины закрыты, редкие прохожие спешат укрыться. Огромная фура Red Arrow проскакивает на красный; следом несутся два полностью чёрных внедорожника.*\n\n**Майкл Маклейн**\n\n— Шеф говорил про чёрные машины. Может, это наша зацепка. Включаем мигалки и догоняем — или едем дальше?\n\n[[Остановить конвой->S07 — 09:00–09:30. Конвой Lazarus]]\n[[Проигнорировать конвой и заехать в «Фунако»->S08 — «Фунако» до 10:00]]\n[[Не останавливаться и сразу ехать в участок->U02 — 09:00. Раннее прибытие в участок]]\n\n","S07 — 09:00–09:30. Конвой Lazarus":"<<set $shorokhKnowsTheoHasImplant = true>>\n*После короткой погони конвой останавливается. Из чёрного внедорожника выходит крепкий мужчина и протягивает документы.*\n\n**Дмитрий Патронченко**\n\n— Дмитрий Патронченко. Частное агентство Lazarus. Это Валерий, мой напарник. Мы сопровождаем груз Red Arrow: балки, сваи, арматура. Документы и разрешения действующие — можете проверить.\n\n*Пока остальные осматривают огромный объём стройматериалов, Тео тайно подключается к сети фуры. Шорох замечает под её волосами разъём скрытого импланта.*\n\n[[Проверить результат взлома->C04 — Проверка взлома конвоя Тео]]\n\n","C04 — Проверка взлома конвоя Тео":"<<if $theoConvoyHackTotal is null>>\n<<set $theoConvoyHackDie1 = random(1, 6)>>\n<<set $theoConvoyHackDie2 = random(1, 6)>>\n<<set $theoConvoyHackDie3 = random(1, 6)>>\n<<set $theoConvoyHackTotal = $theoConvoyHackDie1 + $theoConvoyHackDie2 + $theoConvoyHackDie3 + 2>>\n<<endif>>\n\n**Тео**\n\n— Посмотрим, что вы спрятали за идеально чистыми документами.\n\n**Проверка Интеллекта:** `3d6 + 2` против сложности 11.\n\nКубики: **$theoConvoyHackDie1**, **$theoConvoyHackDie2**, **$theoConvoyHackDie3**. Интеллект Тео: **+2**. Итог: **$theoConvoyHackTotal**.\n\n<<if $theoConvoyHackTotal >= 11>>\n<<set $theoConvoyHackSucceeded = true>>\n[[Продолжить успешный взлом->U14 — Тео получила данные конвоя]]\n<<else>>\n<<set $theoConvoyHackSucceeded = false>>\n[[Продолжить после провала->U15 — Тео не получила данные конвоя]]\n<<endif>>\n\n","U14 — Тео получила данные конвоя":"*В нейроинтерфейсе открываются маршрут и скрытые записи.*\n\n**Тео**\n\n— Заказчик — «Крион». Материалы развозят по периметру Blue Skyport для укреплений. Беспорядки ожидали заранее... и сегодня должны запустить какой-то корпоративный план. Сохраню карту разгрузки, пока меня не заметили.\n\n//В офлайн-сессии на кубиках выпали три шестёрки. До отдельного обсуждения критических эффектов этот результат даёт те же сведения, что и любой обычный успех.//\n\n[[Решить, делиться ли данными с Шорохом->C03 — Подключение к импланту Тео]]\n\n","U15 — Тео не получила данные конвоя":"*Защита сети обрывает соединение. Шорох всё равно успевает заметить имплант Тео.*\n\n**Тео**\n\n— Пусто. Ни маршрута, ни заказчика. И теперь Шорох знает, чем я подключалась. Прекрасно.\n\n//После провала `$theoSharedConvoyDataWithShorokh` остаётся null, а `$teamKnowsConvoyData` — false.//\n\n[[Выбрать дальнейший маршрут->S07B — Выбор после конвоя]]\n\n","C03 — Подключение к импланту Тео":"*Когда остальные отходят, Шорох приподнимает киберруку и указывает на скрытый под волосами Тео разъём.*\n\n**Шорох**\n\n— Я видел, как ты подключалась. Если хочешь передать то, что нашла, мне нужен прямой доступ. Можно?\n\n<<if $selectedCharacter == \"theo\">>\n*Решение принимает игрок за Тео.*\n\n[[Разрешить Шороху подключиться->U12 — Тео передала данные конвоя]]\n[[Отказать Шороху->U13 — Тео сохранила данные у себя]]\n<<else>>\n<<if $theoConvoyShareRoll is null>>\n<<set $theoConvoyShareRoll = random(1, 100)>>\n<<endif>>\n*Решение NPC-Тео определяется стандартной вероятностью: 80% согласия и 20% отказа.*\n\n<<if $theoConvoyShareRoll <= 80>>\n[[Узнать решение Тео->U12 — Тео передала данные конвоя]]\n<<else>>\n[[Узнать решение Тео->U13 — Тео сохранила данные у себя]]\n<<endif>>\n<<endif>>\n\n","U12 — Тео передала данные конвоя":"<<set $theoSharedConvoyDataWithShorokh = true>>\n<<set $teamKnowsConvoyData = true>>\n*Получив записи, Шорох отсоединяет киберруку и поворачивается к команде.*\n\n**Шорох**\n\n— Я покопался в сети конвоя. Заказчик — «Крион». Они укрепляют периметр Blue Skyport, а сегодняшние беспорядки были запланированы заранее. Ещё есть карта разгрузки и упоминание плана, который запустят сегодня.\n\n*Настоящий источник сведений — имплант Тео — остаётся тайной.*\n\n[[Выбрать дальнейший маршрут->S07B — Выбор после конвоя]]\n\n","U13 — Тео сохранила данные у себя":"<<set $theoSharedConvoyDataWithShorokh = false>>\n**Тео**\n\n— Нет. Ты уже увидел больше, чем должен был. Записи останутся у меня.\n\n[[Выбрать дальнейший маршрут->S07B — Выбор после конвоя]]\n\n","S07B — Выбор после конвоя":"*После досмотра Тахи снова заводит патрульную машину.*\n\n**Тахи**\n\n— На этот час осталось полчаса. Заезжаем в «Фунако» или без остановок едем к девятому участку?\n\n[[Заехать в лапшичную «Фунако»->S08 — «Фунако» до 10:00]]\n[[Не заезжать — продолжить к девятому участку->S10 — 10:00. Прибытие к девятому участку]]\n\n","S08 — «Фунако» до 10:00":"<<set $visitedFunako = true>>\n*В почти пустом квартале неоном горит только вывеска «Фунако». Пожилой хозяин ставит на стойку горячую лапшу и, убедившись, что рядом никого нет, понижает голос.*\n\n**Хозяин «Фунако»**\n\n— Вы давно меня знаете, поэтому скажу по секрету: сегодня лучше никуда не соваться. В районе появилось оружие. Полиция уже схлестнулась с бандитами, а разные банды будто готовят что-то вместе.\n\n— Все соседи закрылись. Мне терять нечего, вот я и работаю. Но часов в шесть вечера езжайте домой и запритесь покрепче. Главное — пережить сегодняшний день. Что будет завтра, узнаем завтра.\n\n[[Продолжить к девятому участку →->S10 — 10:00. Прибытие к девятому участку]]\n<<if $teamKnowsBigBoMeeting and $gameHour < 11>>\n[[Поехать к Большому Бо->U01 — Команда встретила Большого Бо][$gameHour = 10]]\n<<endif>>\n\n","U01 — Команда встретила Большого Бо":"<<set $visitedBigBo = true>>\n<<set $knowsStadiumPlan = true>>\n*В пентхаусе «Парадизо» Большой Бо встречает Тахи и его сослуживцев.*\n\n**Большой Бо**\n\n— Хорошо, что вы приехали вовремя. В полдень на стадионе Detroit Rangers готовится нечто важное. Подробности я расскажу, когда эта ветка будет дописана.\n\n//Заглушка несыгранной ветки. Подробное описание сцены, диалоги, последствия и дальнейшие переходы будут добавлены позднее.//\n\n[[Продолжить утренние события к точке синхронизации->SYNC01 — Сбор команды перед стадионом]]\n\n","U02 — 09:00. Раннее прибытие в участок":"*Команда игнорирует конвой и не сворачивает к «Фунако». В 09:00 патрульная машина останавливается перед девятым участком.*\n\n**Шорох**\n\n— Быстро добрались. Теперь узнаем, почему здесь никто не отвечает.\n\n[[Начать осмотр участка->S11 — Девятый участок снаружи]]\n\n","S10 — 10:00. Прибытие к девятому участку":"<<set $gameHour = 10>>\n*Ровно в 10:00 патрульная машина останавливается у девятого участка. Шорох подводит итог дороге.*\n\n**Шорох**\n\n<<if $teamKnowsConvoyData and $visitedFunako>>\n— В сети фуры я нашёл «Крион», срочные укрепления и заранее спланированные беспорядки. А хозяин «Фунако» слышал, что банды готовят общее дело. Совпадением уже не выглядит.\n<<elseif $teamKnowsConvoyData>>\n— В сети фуры я нашёл «Крион», срочные укрепления и заранее спланированные беспорядки. Теперь посмотрим, связано ли это с участком.\n<<elseif $theoConvoyHackSucceeded>>\n— По документам у Lazarus всё чисто, но стройматериалов хватит укрепить целый квартал. Больше зацепиться пока не за что.\n<<elseif visited(\"S07 — 09:00–09:30. Конвой Lazarus\") > 0>>\n— У Lazarus чистые документы и слишком много стройматериалов. Скрытых записей достать не удалось.\n<<else>>\n— Конвой мы пропустили. Из необычного — только предупреждение хозяина «Фунако». Теперь проверяем участок.\n<<endif>>\n\n<<if visited(\"S07 — 09:00–09:30. Конвой Lazarus\") > 0>>\n— Я переслал шефу аудиофрагмент. Он велел немедленно проверить здание и не ввязываться в бой.\n<<endif>>\n\n[[Дальше →->S11 — Девятый участок снаружи]]\n\n","S11 — Девятый участок снаружи":"*У девятого участка стоят пустые патрульные машины. Окно разбито, дверь закрыта, внутри не горит ни одной лампы. Рил всматривается сквозь стену.*\n\n**Рил**\n\n— Вижу внутри неподвижные силуэты. Сейчас попробую понять, остался ли там кто-нибудь живой. У стены ещё есть трансформаторная будка — возможно, Шорох доберётся через неё до камер.\n\n<<if $selectedCharacter is \"theo\">>\n*Пока остальные осматривают здание, Тео может остаться с командой или незаметно ускользнуть.*\n\n[[Принять решение за Тео->C17 — Решение Тео перед входом в участок]]\n<<elseif $selectedCharacter is \"shorokh\">>\n<<set $theoAttemptedSecretPrecinctDeparture = true>>\n<<set $theoStayedWithTeamAtPrecinct = false>>\n<<set $theoUnlockedPrecinctMotorcycle = true>>\n<<set $theoVisitedPsyOps = true>>\n*Пока команда готовится войти, Тео отходит якобы ради связи и незаметно уезжает на найденном мотоцикле. Шорох ещё не знает, куда она направилась.*\n\n[[Провести сканирование Рил->C12 — Сканирование девятого участка Рил]]\n<<else>>\n<<set $theoAttemptedSecretPrecinctDeparture = false>>\n<<set $theoStayedWithTeamAtPrecinct = true>>\n<<set $theoUnlockedPrecinctMotorcycle = null>>\n<<set $theoVisitedPsyOps = false>>\n*Тео остаётся с командой. Во время осмотра она будет наблюдать за действиями остальных.*\n\n[[Провести сканирование Рил->C12 — Сканирование девятого участка Рил]]\n<<endif>>\n\n","C17 — Решение Тео перед входом в участок":"**Тео**\n\n— Девятый участок — работа команды. Но PsyOps недалеко, а Джони всё ещё молчит. Остаться или исчезнуть, пока никто не смотрит?\n\n[[Посетить участок вместе с командой->C12 — Сканирование девятого участка Рил][$theoAttemptedSecretPrecinctDeparture = false; $theoStayedWithTeamAtPrecinct = true]]\n[[Незаметно ускользнуть->C18 — Разблокировка мотоцикла Тео][$theoAttemptedSecretPrecinctDeparture = true]]\n\n","C18 — Разблокировка мотоцикла Тео":"<<if $theoPrecinctMotorcycleCheckTotal is null>>\n<<set $theoPrecinctMotorcycleDie1 = random(1, 6)>>\n<<set $theoPrecinctMotorcycleDie2 = random(1, 6)>>\n<<set $theoPrecinctMotorcycleDie3 = random(1, 6)>>\n<<set $theoPrecinctMotorcycleCheckTotal = $theoPrecinctMotorcycleDie1 + $theoPrecinctMotorcycleDie2 + $theoPrecinctMotorcycleDie3 + 2>>\n<<endif>>\n\n*За углом Тео находит мотоцикл с умной панелью управления.*\n\n**Тео**\n\n— Хорошая защита. Но если быстро подобрать пароль, никто даже не заметит, что меня нет.\n\n**Проверка Интеллекта:** `3d6 + 2` против сложности 11.\n\nКубики: **$theoPrecinctMotorcycleDie1**, **$theoPrecinctMotorcycleDie2**, **$theoPrecinctMotorcycleDie3**. Интеллект Тео: **+2**. Итог: **$theoPrecinctMotorcycleCheckTotal**.\n\n<<if $theoPrecinctMotorcycleCheckTotal >= 11>>\n[[Завести мотоцикл и уехать->U39 — Тео уехала в PsyOps]]\n<<else>>\n[[Вернуться к команде->U40 — Тео не смогла разблокировать мотоцикл]]\n<<endif>>\n\n","U39 — Тео уехала в PsyOps":"<<set $theoUnlockedPrecinctMotorcycle = true>>\n<<set $theoStayedWithTeamAtPrecinct = false>>\n<<set $theoVisitedPsyOps = true>>\n*Панель загорается, двигатель оживает.*\n\n**Тео**\n\n— Получилось. До PsyOps отсюда несколько минут. Вернусь раньше, чем они начнут задавать вопросы.\n\n[[Добраться до офиса PsyOps->S15 — Тео проникает в PsyOps]]\n\n","U40 — Тео не смогла разблокировать мотоцикл":"<<set $theoUnlockedPrecinctMotorcycle = false>>\n<<set $theoStayedWithTeamAtPrecinct = true>>\n*Панель блокирует следующую попытку. Из-за угла уже слышны голоса команды.*\n\n**Тео**\n\n— Времени нет. Придётся вернуться и делать вид, что я никуда не собиралась.\n\n[[Вернуться к осмотру участка->C12 — Сканирование девятого участка Рил]]\n\n","C12 — Сканирование девятого участка Рил":"<<if $reLPrecinctLifeScanTotal is null>>\n<<set $reLPrecinctLifeScanDie1 = random(1, 6)>>\n<<set $reLPrecinctLifeScanDie2 = random(1, 6)>>\n<<set $reLPrecinctLifeScanDie3 = random(1, 6)>>\n<<set $reLPrecinctLifeScanTotal = $reLPrecinctLifeScanDie1 + $reLPrecinctLifeScanDie2 + $reLPrecinctLifeScanDie3 + 2>>\n<<endif>>\n\n**Рил**\n\n— Помехи сильные. Отсею их и попробую различить признаки жизни.\n\n**Проверка Воли:** `3d6 + 2` против сложности 11.\n\nКубики: **$reLPrecinctLifeScanDie1**, **$reLPrecinctLifeScanDie2**, **$reLPrecinctLifeScanDie3**. Воля Рил: **+2**. Итог: **$reLPrecinctLifeScanTotal**.\n\n<<if $reLPrecinctLifeScanTotal >= 11>>\n[[Сообщить результат сканирования->U29 — Рил не обнаружила живых]]\n<<else>>\n[[Продолжить после неудачного сканирования->U30 — Рил не смогла определить состояние людей]]\n<<endif>>\n\n","U29 — Рил не обнаружила живых":"<<set $reLPrecinctLifeScanSucceeded = true>>\n**Рил**\n\n— Сканирование завершено. Внутри есть тела. Признаков жизни не обнаружено.\n\n[[Решить, будет ли Шорох подключаться->C10 — Решение о подключении к системе наблюдения]]\n\n","U30 — Рил не смогла определить состояние людей":"<<set $reLPrecinctLifeScanSucceeded = false>>\n**Рил**\n\n— Вижу неподвижные силуэты, но стены и помехи гасят сигнал. Не могу подтвердить, живы они или нет.\n\n[[Решить, будет ли Шорох подключаться->C10 — Решение о подключении к системе наблюдения]]\n\n","C10 — Решение о подключении к системе наблюдения":"<<if $selectedCharacter is \"shorokh\">>\n**Шорох**\n\n— Можно вскрыть будку и подключиться к камерам через силовую линию. Вопрос только в том, сколько там осталось защиты.\n\n[[Подключиться к системе видеонаблюдения->C11 — Подключение Шороха к системе наблюдения]]\n[[Не рисковать и сразу войти в участок->U28 — Шорох отказался от подключения]]\n<<else>>\n<<if $shorokhSurveillanceConnectionRoll is null>>\n<<set $shorokhSurveillanceConnectionRoll = random(1, 100)>>\n<<endif>>\n*Решение NPC-Шороха определяется пассивной проверкой: 80% — подключиться, 20% — отказаться.*\n\n<<if $shorokhSurveillanceConnectionRoll <= 80>>\n[[Узнать решение Шороха->C11 — Подключение Шороха к системе наблюдения]]\n<<else>>\n[[Узнать решение Шороха->U28 — Шорох отказался от подключения]]\n<<endif>>\n<<endif>>\n\n","C11 — Подключение Шороха к системе наблюдения":"<<set $shorokhTriedPrecinctSurveillanceConnection = true>>\n<<if $shorokhPrecinctSurveillanceCheckTotal is null>>\n<<set $shorokhPrecinctSurveillanceDie1 = random(1, 6)>>\n<<set $shorokhPrecinctSurveillanceDie2 = random(1, 6)>>\n<<set $shorokhPrecinctSurveillanceDie3 = random(1, 6)>>\n<<set $shorokhPrecinctSurveillanceCheckTotal = $shorokhPrecinctSurveillanceDie1 + $shorokhPrecinctSurveillanceDie2 + $shorokhPrecinctSurveillanceDie3 + 3>>\n<<endif>>\n\n*Шорох вскрывает трансформаторную будку и подводит разъём левой киберруки к силовой линии.*\n\n**Шорох**\n\n— Если сеть ещё жива, она либо покажет камеры, либо ударит первой.\n\n**Проверка Интеллекта:** `3d6 + 3` против сложности 11.\n\nКубики: **$shorokhPrecinctSurveillanceDie1**, **$shorokhPrecinctSurveillanceDie2**, **$shorokhPrecinctSurveillanceDie3**. Интеллект Шороха: **+3**. Итог: **$shorokhPrecinctSurveillanceCheckTotal**.\n\n<<if $shorokhPrecinctSurveillanceCheckTotal >= 11>>\n[[Завершить безопасное подключение->U26 — Безопасное подключение к системе наблюдения]]\n<<else>>\n[[Продолжить после повреждения руки->U27 — Подключение повредило киберруку]]\n<<endif>>\n\n","U26 — Безопасное подключение к системе наблюдения":"<<set $shorokhPrecinctSurveillanceCheckSucceeded = true>>\n**Шорох**\n\n— Подключение чистое. Только смотреть здесь нечего: систему наблюдения разбили, камеры ничего не отдают.\n\n[[Войти в участок->S12 — Мина у входа]]\n\n","U27 — Подключение повредило киберруку":"<<set $shorokhPrecinctSurveillanceCheckSucceeded = false>>\n<<set $shorokhLeftArmHp = Math.max(0, $shorokhLeftArmHp - 1)>>\n*Разряд проходит по интерфейсам киберруки. Левая рука получает 1 урон: **$shorokhLeftArmHp из 3 HP**.*\n\n**Шорох**\n\n— Ай. Система мертва, но напоследок укусить ещё умеет. Записей здесь не получить.\n\n[[Войти в участок->S12 — Мина у входа]]\n\n","U28 — Шорох отказался от подключения":"<<set $shorokhTriedPrecinctSurveillanceConnection = false>>\n**Шорох**\n\n— Нет. Проводка выглядит так, будто ждёт дурака с открытым портом. Проверим камеры изнутри.\n\n[[Сразу войти в участок->S12 — Мина у входа]]\n\n","S12 — Мина у входа":"*Шорох первым переступает порог. На уровне пола едва заметно дрожит лазерный луч.*\n\n**Шорох**\n\n— Стойте. У входа растяжка... Чёрт, я уже в шаге от неё.\n\n[[Проверить, успеет ли Шорох переступить луч->C08 — Проверка мины у входа]]\n\n","C08 — Проверка мины у входа":"<<if $shorokhPrecinctMineCheckTotal is null>>\n<<set $shorokhPrecinctMineDie1 = random(1, 6)>>\n<<set $shorokhPrecinctMineDie2 = random(1, 6)>>\n<<set $shorokhPrecinctMineDie3 = random(1, 6)>>\n<<set $shorokhPrecinctMineCheckTotal = $shorokhPrecinctMineDie1 + $shorokhPrecinctMineDie2 + $shorokhPrecinctMineDie3 + 1>>\n<<endif>>\n\n**Шорох**\n\n— Только не дёргаться. Перенести ногу через луч и не задеть корпус.\n\n**Проверка Атлетики:** `3d6 + 1` против сложности 11.\n\nКубики: **$shorokhPrecinctMineDie1**, **$shorokhPrecinctMineDie2**, **$shorokhPrecinctMineDie3**. Атлетика Шороха: **+1**. Итог: **$shorokhPrecinctMineCheckTotal**.\n\n<<if $shorokhPrecinctMineCheckTotal >= 11>>\n<<set $shorokhAvoidedPrecinctMine = true>>\n[[Открыть подквест обезвреживания->U23 — Мина обезврежена]]\n<<else>>\n<<set $shorokhAvoidedPrecinctMine = false>>\n[[Продолжить после взрыва->U22 — Мина сработала]]\n<<endif>>\n\n","U22 — Мина сработала":"<<set $shorokhRightLegHp = Math.max(0, $shorokhRightLegHp - 2)>>\n<<set $shorokhLeftLegHp = Math.max(0, $shorokhLeftLegHp - 2)>>\n*Лазер обрывается. Взрыв отбрасывает Шороха к стене и ранит обе ноги.*\n\nВзрыв наносит по 2 урона каждой ноге. Правая нога: **$shorokhRightLegHp из 6 HP**. Левая нога: **$shorokhLeftLegHp из 6 HP**.\n\n**Шорох**\n\n— Живой. Обе ноги зацепило, но ходить смогу. Только никому больше сюда не наступать.\n\n//До стадиона уменьшенные HP сохраняются, но пока не меняют доступные действия. Подмога не приходит: Ричи не может никого прислать, десятый участок заявляет, что все машины заняты.//\n\n[[Решить, окажет ли Майкл первую помощь->C09 — Решение Майкла о первой помощи]]\n\n","C09 — Решение Майкла о первой помощи":"*Майкл вытаскивает из машины аптечку и осматривает ноги Шороха.*\n\n**Майкл Маклейн**\n\n— Осколки прошли неглубоко. Могу быстро перевязать, если не будем терять время.\n\n<<if $selectedCharacter is \"michael\">>\n*Решение принимает игрок за Майкла.*\n\n[[Оказать Шороху первую помощь->U24 — Майкл оказал первую помощь]]\n[[Оставить состояние Шороха без изменений->U25 — Майкл не оказал первую помощь]]\n<<else>>\n<<if $michaelFirstAidRoll is null>>\n<<set $michaelFirstAidRoll = random(1, 100)>>\n<<endif>>\n*Решение NPC-Майкла определяется пассивной проверкой: 80% — помочь, 20% — оставить ранения без изменений.*\n\n<<if $michaelFirstAidRoll <= 80>>\n[[Узнать решение Майкла->U24 — Майкл оказал первую помощь]]\n<<else>>\n[[Узнать решение Майкла->U25 — Майкл не оказал первую помощь]]\n<<endif>>\n<<endif>>\n\n","U24 — Майкл оказал первую помощь":"<<set $michaelProvidedFirstAid = true>>\n<<set $shorokhRightLegHp = Math.min(6, $shorokhRightLegHp + 1)>>\n<<set $shorokhLeftLegHp = Math.min(6, $shorokhLeftLegHp + 1)>>\n**Майкл Маклейн**\n\n— Готово. Не геройствуй и смотри под ноги хотя бы следующие пять минут.\n\nОбе ноги восстанавливают по 1 HP.\n\nПравая нога: **$shorokhRightLegHp из 6 HP**. Левая нога: **$shorokhLeftLegHp из 6 HP**.\n\n[[Продолжить осмотр участка->S13 — Расстрел в девятом участке]]\n\n","U25 — Майкл не оказал первую помощь":"<<set $michaelProvidedFirstAid = false>>\n**Майкл Маклейн**\n\n— Кровотечение не критичное. Сейчас важнее проверить здание — обработаем потом.\n\nHP ног остаётся без изменений: правая — **$shorokhRightLegHp из 6**, левая — **$shorokhLeftLegHp из 6**.\n\n[[Продолжить осмотр участка->S13 — Расстрел в девятом участке]]\n\n","U23 — Мина обезврежена":"*Шорох переступает луч. Тахи опускается рядом с устройством и изучает схему взрывателя.*\n\n**Тахи**\n\n— Проход пока закрыт. Дайте мне минуту и ничего здесь не трогайте.\n\n[[Начать обезвреживание->C21 — Проверка обезвреживания мины Тахи]]\n\n","C21 — Проверка обезвреживания мины Тахи":"<<if $tahiPrecinctMineDefusalTotal is null>>\n<<set $tahiPrecinctMineDefusalDie1 = random(1, 6)>>\n<<set $tahiPrecinctMineDefusalDie2 = random(1, 6)>>\n<<set $tahiPrecinctMineDefusalDie3 = random(1, 6)>>\n<<set $tahiPrecinctMineDefusalTotal = $tahiPrecinctMineDefusalDie1 + $tahiPrecinctMineDefusalDie2 + $tahiPrecinctMineDefusalDie3 + 1>>\n<<endif>>\n\n**Тахи**\n\n— Схема старая, но поставили её аккуратно. Нужно разомкнуть правильную цепь.\n\n**Проверка Интеллекта:** `3d6 + 1` против сложности 11.\n\nКубики: **$tahiPrecinctMineDefusalDie1**, **$tahiPrecinctMineDefusalDie2**, **$tahiPrecinctMineDefusalDie3**. Интеллект Тахи: **+1**. Итог: **$tahiPrecinctMineDefusalTotal**.\n\n<<if $tahiPrecinctMineDefusalTotal >= 11>>\n<<set $tahiPrecinctMineDefusalSucceeded = true>>\n[[Завершить обезвреживание->U42 — Тахи обезвредил мину]]\n<<else>>\n<<set $tahiPrecinctMineDefusalSucceeded = false>>\n[[Продолжить после взрыва->U43 — Мина взорвалась при обезвреживании]]\n<<endif>>\n\n","U42 — Тахи обезвредил мину":"<<set $precinctMineDefused = true>>\n*Индикатор на взрывателе гаснет.*\n\n**Тахи**\n\n— Обезврежена. Теперь можно входить.\n\n[[Продолжить осмотр участка->S13 — Расстрел в девятом участке]]\n\n","U43 — Мина взорвалась при обезвреживании":"<<set $precinctMineDefused = false>>\n<<set $tahiRightArmHp = Math.max(0, $tahiRightArmHp - 2)>>\n<<set $tahiLeftArmHp = Math.max(0, $tahiLeftArmHp - 2)>>\n<<set $tahiTorsoHp = Math.max(0, $tahiTorsoHp - 2)>>\n*Тахи размыкает не ту цепь. Мина взрывается у него в руках и наносит по 2 урона обеим рукам и корпусу.*\n\nПравая рука: **$tahiRightArmHp из 7 HP**. Левая рука: **$tahiLeftArmHp из 7 HP**. Корпус: **$tahiTorsoHp из 12 HP**.\n\n**Тахи**\n\n— Живой. Руки на месте. Проход теперь тоже свободен.\n\n[[Перейти к первой помощи->C22 — Первая помощь Тахи]]\n\n","C22 — Первая помощь Тахи":"*Майкл осматривает ожоги и осколочные ранения Тахи.*\n\n**Майкл Маклейн**\n\n— Могу обработать руки и корпус прямо сейчас. Решай быстро.\n\n<<if $selectedCharacter is \"michael\">>\n*Решение принимает игрок за Майкла.*\n\n[[Оказать Тахи первую помощь->U44 — Майкл помог Тахи]]\n[[Оставить ранения без изменений->U45 — Майкл не помог Тахи]]\n<<else>>\n<<if $michaelTahiFirstAidRoll is null>>\n<<set $michaelTahiFirstAidRoll = random(1, 100)>>\n<<endif>>\n*Для NPC-Майкла применяется пассивная проверка: 80% — помочь, 20% — оставить ранения без изменений.*\n\n<<if $michaelTahiFirstAidRoll <= 80>>\n[[Узнать результат помощи->U44 — Майкл помог Тахи]]\n<<else>>\n[[Узнать результат помощи->U45 — Майкл не помог Тахи]]\n<<endif>>\n<<endif>>\n\n","U44 — Майкл помог Тахи":"<<set $michaelProvidedTahiFirstAid = true>>\n<<set $tahiRightArmHp = Math.min(7, $tahiRightArmHp + 1)>>\n<<set $tahiLeftArmHp = Math.min(7, $tahiLeftArmHp + 1)>>\n<<set $tahiTorsoHp = Math.min(12, $tahiTorsoHp + 1)>>\n**Майкл Маклейн**\n\n— Закончил. Неглубокие раны закрыл, дальше нужен нормальный медик.\n\nОбе руки и корпус восстанавливают по 1 HP.\n\nПравая рука: **$tahiRightArmHp из 7 HP**. Левая рука: **$tahiLeftArmHp из 7 HP**. Корпус: **$tahiTorsoHp из 12 HP**.\n\n[[Продолжить осмотр участка->S13 — Расстрел в девятом участке]]\n\n","U45 — Майкл не помог Тахи":"<<set $michaelProvidedTahiFirstAid = false>>\n**Майкл Маклейн**\n\n— Сейчас не успеем. Останови кровь сам, а я прикрою проход.\n\nHP обеих рук и корпуса Тахи остаётся без изменений.\n\nПравая рука: **$tahiRightArmHp из 7 HP**. Левая рука: **$tahiLeftArmHp из 7 HP**. Корпус: **$tahiTorsoHp из 12 HP**.\n\n[[Продолжить осмотр участка->S13 — Расстрел в девятом участке]]\n\n","S13 — Расстрел в девятом участке":"*Внутри лежат полицейские, пленные Потрошители и шеф Аарон Буч. Тахи осматривает пробоины и положение тел.*\n\n**Тахи**\n\n— Все убиты. Стреляли точно, после первых попаданий делали контрольные. Так работают опытные солдаты, не уличная банда. Арсенал не тронули, зато внутренние камеры уничтожили.\n\n[[Дальше →->D06 — Рил определяет время смерти]]\n\n","D06 — Рил определяет время смерти":"*Рил склоняется над ближайшим телом и сопоставляет показания сенсоров.*\n\n**Рил**\n\n— Температура тканей и свёртывание крови совпадают. Они погибли примерно в три часа ночи — вскоре после последнего донесения.\n\n//Дополнительное исследование места убийства выполняет только выбранный персонаж. NPC не проходят проверки этой сцены.//\n\n<<if $selectedCharacter is \"michael\">>\n[[Исследовать гильзы Майклом->C13 — Проверка гильз Майклом]]\n<<elseif $selectedCharacter is \"tahi\">>\n[[Исследовать следы стрельбы Тахи->C15 — Проверка следов стрельбы Тахи]]\n<<else>>\n[[Продолжить осмотр участка->C07 — Проверка диска внутренних камер]]\n<<endif>>\n\n","C13 — Проверка гильз Майклом":"<<if $michaelPrecinctBallisticsCheckTotal is null>>\n<<set $michaelPrecinctBallisticsDie1 = random(1, 6)>>\n<<set $michaelPrecinctBallisticsDie2 = random(1, 6)>>\n<<set $michaelPrecinctBallisticsDie3 = random(1, 6)>>\n<<set $michaelPrecinctBallisticsCheckTotal = $michaelPrecinctBallisticsDie1 + $michaelPrecinctBallisticsDie2 + $michaelPrecinctBallisticsDie3 + 1 + 1>>\n<<endif>>\n\n**Майкл Маклейн**\n\n— Нападавшие подчистили гильзы, но могли что-то пропустить. Посмотрим внимательнее.\n\n**Проверка Интеллекта:** `3d6 + 1 + 1` против сложности 11.\n\nКубики: **$michaelPrecinctBallisticsDie1**, **$michaelPrecinctBallisticsDie2**, **$michaelPrecinctBallisticsDie3**. Интеллект Майкла: **+1**. Ситуационный бонус: **+1**. Итог: **$michaelPrecinctBallisticsCheckTotal**.\n\n<<if $michaelPrecinctBallisticsCheckTotal >= 11>>\n[[Изучить найденную улику->U31 — Майкл обнаружил дополнительный факт]]\n<<else>>\n[[Продолжить после неудачного поиска->U32 — Майкл не определил оружие]]\n<<endif>>\n\n","U31 — Майкл обнаружил дополнительный факт":"<<set $michaelLearnedPrecinctBallisticsFact = true>>\n**Майкл Маклейн**\n\n— Здесь есть ещё одна деталь. Пока не могу объяснить её значение, но она пригодится нам позже.\n\n//Заглушка: содержание факта и его конкретное влияние на последующие проверки или ветки будут определены позднее.//\n\n[[Решить, сообщит ли Майкл найденный факт->C14 — Раскрытие баллистического факта]]\n\n","C14 — Раскрытие баллистического факта":"**Майкл Маклейн**\n\n— Рассказать остальным о находке или сохранить её при себе?\n\n[[Рассказать команде о находке->U33 — Майкл раскрыл баллистический факт]]\n[[Скрыть найденный факт->U34 — Майкл сохранил баллистический факт в тайне]]\n\n","U33 — Майкл раскрыл баллистический факт":"<<set $teamKnowsPrecinctBallisticsFact = true>>\n**Майкл Маклейн**\n\n— Смотрите сюда. Я нашёл деталь, которая может помочь нам дальше.\n\n//Содержание факта и его конкретное применение будут добавлены позднее.//\n\n[[Осмотреть уничтоженное оборудование->C07 — Проверка диска внутренних камер]]\n\n","U34 — Майкл сохранил баллистический факт в тайне":"<<set $teamKnowsPrecinctBallisticsFact = false>>\n**Майкл Маклейн**\n\n— Сначала разберусь сам. Остальным пока ничего не скажу.\n\n[[Осмотреть уничтоженное оборудование->C07 — Проверка диска внутренних камер]]\n\n","U32 — Майкл не определил оружие":"<<set $michaelLearnedPrecinctBallisticsFact = false>>\n**Майкл Маклейн**\n\n— Гильз нет. Они тщательно подчистили всё, по чему можно было бы определить оружие. Остаётся только общий вывод: работали профессионалы.\n\n[[Осмотреть уничтоженное оборудование->C07 — Проверка диска внутренних камер]]\n\n","C15 — Проверка следов стрельбы Тахи":"<<if $tahiPrecinctBallisticsCheckTotal is null>>\n<<set $tahiPrecinctBallisticsDie1 = random(1, 6)>>\n<<set $tahiPrecinctBallisticsDie2 = random(1, 6)>>\n<<set $tahiPrecinctBallisticsDie3 = random(1, 6)>>\n<<set $tahiPrecinctBallisticsCheckTotal = $tahiPrecinctBallisticsDie1 + $tahiPrecinctBallisticsDie2 + $tahiPrecinctBallisticsDie3 + 1 + 1>>\n<<endif>>\n\n**Тахи**\n\n— Я знаю, как выглядят следы подготовленного огня. Здесь могло остаться что-то, чего не заметят остальные.\n\n**Проверка Интеллекта:** `3d6 + 1 + 1` против сложности 11.\n\nКубики: **$tahiPrecinctBallisticsDie1**, **$tahiPrecinctBallisticsDie2**, **$tahiPrecinctBallisticsDie3**. Интеллект Тахи: **+1**. Ситуационный бонус: **+1**. Итог: **$tahiPrecinctBallisticsCheckTotal**.\n\n<<if $tahiPrecinctBallisticsCheckTotal >= 11>>\n[[Изучить находку Тахи->U35 — Тахи обнаружил отдельный факт]]\n<<else>>\n[[Продолжить после неудачного осмотра->U36 — Тахи не обнаружил дополнительный факт]]\n<<endif>>\n\n","U35 — Тахи обнаружил отдельный факт":"<<set $tahiLearnedPrecinctBallisticsFact = true>>\n**Тахи**\n\n— Нашёл. Это не та улика, которую искал бы Майкл. Запомню — она может помочь нам позже.\n\n//Заглушка: содержание факта Тахи и его конкретное влияние будут определены позднее.//\n\n[[Решить, сообщит ли Тахи найденный факт->C16 — Раскрытие факта Тахи]]\n\n","U36 — Тахи не обнаружил дополнительный факт":"<<set $tahiLearnedPrecinctBallisticsFact = false>>\n**Тахи**\n\n— Ничего дополнительного. Только точные попадания и контрольные выстрелы. Этого достаточно, чтобы понять: стреляли профессионалы.\n\n[[Осмотреть уничтоженное оборудование->C07 — Проверка диска внутренних камер]]\n\n","C16 — Раскрытие факта Тахи":"**Тахи**\n\n— Сказать команде о найденной детали или пока оставить её при себе?\n\n[[Рассказать команде о находке->U37 — Тахи раскрыл найденный факт]]\n[[Скрыть найденный факт->U38 — Тахи сохранил найденный факт в тайне]]\n\n","U37 — Тахи раскрыл найденный факт":"<<set $teamKnowsTahiPrecinctBallisticsFact = true>>\n**Тахи**\n\n— Обратите внимание на эту деталь. Позже она может дать нам преимущество.\n\n//Содержание факта и его конкретное применение будут добавлены позднее.//\n\n[[Осмотреть уничтоженное оборудование->C07 — Проверка диска внутренних камер]]\n\n","U38 — Тахи сохранил найденный факт в тайне":"<<set $teamKnowsTahiPrecinctBallisticsFact = false>>\n**Тахи**\n\n— Пока не уверен, что правильно понял след. Не буду отвлекать остальных.\n\n[[Осмотреть уничтоженное оборудование->C07 — Проверка диска внутренних камер]]\n\n","C07 — Проверка диска внутренних камер":"*Среди уничтоженного оборудования Шорох находит повреждённый диск.*\n\n**Шорох**\n\n— Корпус разбит, контроллер обгорел. Но если пластины целы, запись ещё можно будет вытащить.\n\n<<if $shorokhPrecinctDriveCheckTotal is null>>\n<<set $shorokhPrecinctDriveDie1 = random(1, 6)>>\n<<set $shorokhPrecinctDriveDie2 = random(1, 6)>>\n<<set $shorokhPrecinctDriveDie3 = random(1, 6)>>\n<<set $shorokhPrecinctDriveCheckTotal = $shorokhPrecinctDriveDie1 + $shorokhPrecinctDriveDie2 + $shorokhPrecinctDriveDie3 + 3>>\n<<endif>>\n\n**Проверка Интеллекта:** `3d6 + 3` против сложности 11.\n\nКубики: **$shorokhPrecinctDriveDie1**, **$shorokhPrecinctDriveDie2**, **$shorokhPrecinctDriveDie3**. Интеллект Шороха: **+3**. Итог: **$shorokhPrecinctDriveCheckTotal**.\n\n<<if $shorokhPrecinctDriveCheckTotal >= 11>>\n<<set $shorokhRecognizedRepairablePrecinctDrive = true>>\n[[Забрать потенциально восстановимый диск->U20 — Шорох сохранил повреждённый диск]]\n<<else>>\n<<set $shorokhRecognizedRepairablePrecinctDrive = false>>\n[[Оставить диск в участке->U21 — Шорох забраковал повреждённый диск]]\n<<endif>>\n\n","U20 — Шорох сохранил повреждённый диск":"<<set $hasDamagedPrecinctDrive = true>>\n**Шорох**\n\n— Не безнадёжен. Сейчас читать нельзя, но в мастерской попробую восстановить. Забираю.\n\n[[Продолжить осмотр участка->S14 — Камера с восьмичасовым циклом]]\n\n","U21 — Шорох забраковал повреждённый диск":"**Шорох**\n\n— Нет. Здесь восстанавливать нечего. Оставляем — только время потеряем.\n\n//`$hasDamagedPrecinctDrive` остаётся false.//\n\n[[Продолжить осмотр участка->S14 — Камера с восьмичасовым циклом]]\n\n","S14 — Камера с восьмичасовым циклом":"*Майкл выходит наружу и осматривает соседние здания.*\n\n**Майкл Маклейн**\n\n— Внутренние камеры уничтожили. Значит, ищем внешнюю — такую, в чьё поле зрения попал вход.\n\n<<if $gameHour >= 11>>\nЕсли камера найдётся, запись нападения около 03:00 уже будет стёрта новой циклической записью: восьмичасовой буфер успел перезаписаться к началу периода 11:00–12:00.\n<<endif>>\n\n[[Проверить, заметил ли Майкл камеру->C05 — Поиск внешней камеры]]\n\n","C05 — Поиск внешней камеры":"<<if $michaelCameraSearchTotal is null>>\n<<set $michaelCameraSearchDie1 = random(1, 6)>>\n<<set $michaelCameraSearchDie2 = random(1, 6)>>\n<<set $michaelCameraSearchDie3 = random(1, 6)>>\n<<set $michaelCameraSearchTotal = $michaelCameraSearchDie1 + $michaelCameraSearchDie2 + $michaelCameraSearchDie3 + 1 + 1>>\n<<endif>>\n\n**Майкл Маклейн**\n\n— Вывески, перекрёсток, недострой... Где-то здесь должна быть камера.\n\n**Проверка Интеллекта:** `3d6 + 1 + 1` против сложности 11.\n\nКубики: **$michaelCameraSearchDie1**, **$michaelCameraSearchDie2**, **$michaelCameraSearchDie3**. Интеллект: **+1**. Ситуационный бонус: **+1**. Итог: **$michaelCameraSearchTotal**.\n\n<<if $michaelCameraSearchTotal >= 11>>\n<<set $michaelFoundExternalCamera = true>>\n[[Осмотреть найденную камеру->U16 — Майкл заметил внешнюю камеру]]\n<<else>>\n<<set $michaelFoundExternalCamera = false>>\n[[Продолжить после неудачного поиска->U17 — Команда не заметила камеру]]\n<<endif>>\n\n","U16 — Майкл заметил внешнюю камеру":"*На недостроенном здании, примерно в пятнадцати метрах над землёй, видна старая камера.*\n\n**Майкл Маклейн**\n\n— Нашёл. Пишет локально, значит, диск внутри. Только висит высоко.\n\n<<if $gameHour < 11>>\nЗапись нападения около 03:00 ещё находится в буфере, но вот-вот исчезнет.\n<<else>>\nК началу периода 11:00–12:00 запись нападения около 03:00 уже стёрта более новой циклической записью.\n<<endif>>\n\nЧтобы получить улику, Майклу нужно подняться по стене и снять камеру.\n\n[[Попытаться снять камеру->C06 — Подъём Майкла к камере]]\n\n","U17 — Команда не заметила камеру":"**Майкл Маклейн**\n\n— Ничего. Либо внешних камер нет, либо я её не вижу. Придётся продолжать без записи.\n\n<<if $theoStayedWithTeamAtPrecinct>>\n[[Продолжить вместе с командой->S17A — Тео осталась в участке]]\n<<else>>\n[[Перейти к параллельной линии Тео->S15 — Тео проникает в PsyOps]]\n<<endif>>\n\n","C06 — Подъём Майкла к камере":"<<if $michaelCameraClimbTotal is null>>\n<<set $michaelCameraClimbDie1 = random(1, 6)>>\n<<set $michaelCameraClimbDie2 = random(1, 6)>>\n<<set $michaelCameraClimbDie3 = random(1, 6)>>\n<<set $michaelCameraClimbTotal = $michaelCameraClimbDie1 + $michaelCameraClimbDie2 + $michaelCameraClimbDie3 + 3>>\n<<endif>>\n\n**Майкл Маклейн**\n\n— Пятнадцать метров. Заберусь одним рывком, пока буфер не успел перезаписаться.\n\n**Проверка Атлетики:** `3d6 + 3` против сложности 11. Бонусы и штрафы не применяются.\n\nКубики: **$michaelCameraClimbDie1**, **$michaelCameraClimbDie2**, **$michaelCameraClimbDie3**. Атлетика: **+3**. Итог: **$michaelCameraClimbTotal**.\n\n<<if $michaelCameraClimbTotal >= 11>>\n<<set $michaelRetrievedExternalCamera = true>>\n[[Снять и передать камеру Шороху->U18 — Внешняя камера получена]]\n<<else>>\n<<set $michaelRetrievedExternalCamera = false>>\n[[Продолжить после падения камеры->U19 — Внешняя камера разбилась]]\n<<endif>>\n\n","U18 — Внешняя камера получена":"<<set $shorokhHasExternalCameraDrive = true>>\n<<if $gameHour < 11>>\n<<set $externalCameraHasAttackRecording = true>>\n<<else>>\n<<set $externalCameraHasAttackRecording = false>>\n<<endif>>\n*Майкл аккуратно снимает камеру и спускается.*\n\n**Майкл Маклейн**\n\n— Держи, Шорох. Теперь твоя работа — скажи, что осталось на диске.\n\n[[Передать камеру Шороху->U41 — Шорох проверяет внешнюю камеру]]\n\n","U41 — Шорох проверяет внешнюю камеру":"*Шорох подключает диск камеры к терминалу полицейской машины.*\n\n**Шорох**\n\n<<if $externalCameraHasAttackRecording>>\n— Запись есть. Два чёрных внедорожника. Вооружённые люди входят в участок, через некоторое время возвращаются и уезжают.\n\n<<if visited(\"S07 — 09:00–09:30. Конвой Lazarus\") > 0>>\n— Это те же люди, которых мы остановили вместе с конвоем Lazarus.\n<<else>>\n— Лиц и принадлежности мы не знаем: конвой прошёл мимо нас.\n<<endif>>\n<<else>>\n— Опоздали. Буфер восьмичасовой, запись нападения уже затёрта новым циклом. Камера бесполезна — оставлю здесь.\n<<endif>>\n\n<<if $theoStayedWithTeamAtPrecinct>>\n[[Продолжить вместе с командой->S17A — Тео осталась в участке]]\n<<else>>\n[[Перейти к параллельной линии Тео->S15 — Тео проникает в PsyOps]]\n<<endif>>\n\n","U19 — Внешняя камера разбилась":"*На спуске камера выскальзывает из руки и разбивается о бетон.*\n\n**Майкл Маклейн**\n\n— Чёрт. Диск расколот. Шороху здесь уже нечего проверять.\n\n<<if $theoStayedWithTeamAtPrecinct>>\n[[Продолжить вместе с командой->S17A — Тео осталась в участке]]\n<<else>>\n[[Перейти к параллельной линии Тео->S15 — Тео проникает в PsyOps]]\n<<endif>>\n\n","S15 — Тео проникает в PsyOps":"<<set $theoVisitedPsyOps = true>>\n<<if $selectedCharacter is \"shorokh\">>\n*Во время осмотра участка Шорох принимает скрытый звонок Тео.*\n\n**Тео**\n\n— Я в офисе PsyOps. Здесь три активных боевых робота, и мне нужно пройти мимо них. Не спрашивай, зачем я здесь. Просто скажи, ты помнишь что-нибудь об этой модели?\n\n<<set $shorokhKnowsTheoVisitedPsyOps = true>>\n[[Попытаться вспомнить сведения о роботах->C01 — Проверка памяти Шороха]]\n<<else>>\n*Закрытый офис PsyOps не отвечает на вызов. Тео вскрывает окно ножом и проникает в серверную. Между стойками ходит ремонтный дроид; три боевых робота стоят в режиме ожидания.*\n\n**Тео**\n\n— Джони, если ты здесь, подай хоть какой-нибудь знак. И пожалуйста, пусть эти игрушки останутся выключенными.\n\n[[Дальше →->S16 — Вирус в сети PsyOps]]\n<<endif>>\n\n","S16 — Вирус в сети PsyOps":"<<set $shorokhKnowsTheoVisitedPsyOps = true>>\n*Тео подключается к локальной сети. На камерах — двое нетраннеров с выжженными вирусом мозгами и Джони без сознания, с пустым стимулятором в руке. Чужой код замечает подключение и тянется к её нейроимпланту. Тео обрывает связь и набирает Шороха.*\n\n**Тео**\n\n— Джони жив, но до него не добраться: роботы проснулись. Шорох, мне нужна твоя память. И об этом звонке никто не должен узнать.\n\n[[Проверить, вспомнит ли Шорох сведения о роботах->C01 — Проверка памяти Шороха]]\n\n","C01 — Проверка памяти Шороха":"<<set $shorokhRobotDie1 = random(1, 6)>>\n<<set $shorokhRobotDie2 = random(1, 6)>>\n<<set $shorokhRobotDie3 = random(1, 6)>>\n<<set $shorokhRobotCheckTotal = $shorokhRobotDie1 + $shorokhRobotDie2 + $shorokhRobotDie3 + 3>>\n\n**Шорох**\n\n— Три боевых робота... Я встречал такую схему отключения. Надо только вытащить её из головы.\n\n**Проверка Интеллекта:** `3d6 + 3` против сложности 11.\n\nКубики: **$shorokhRobotDie1**, **$shorokhRobotDie2**, **$shorokhRobotDie3**. Интеллект Шороха: **+3**. Итог: **$shorokhRobotCheckTotal**.\n\n<<if $shorokhRobotCheckTotal >= 11>>\n<<set $shorokhRememberedRobotInfo = true>>\n**Шорох**\n\n— Вспомнил. Найди сервисную шину под левым щитком и передай такой код...\n\n[[Передать информацию Тео->U06 — Тео обезвредила роботов]]\n<<else>>\n<<set $shorokhRememberedRobotInfo = false>>\n**Шорох**\n\n— Нет. В голове только шум и обрывки схем. Сам я сейчас ничего надёжного не скажу — придётся идти туда вместе.\n\n<<if $selectedCharacter is \"theo\">>\n[[Вернуться к команде после параллельного осмотра->C20 — Скрытые проверки группы в участке]]\n<<else>>\n[[Вернуться к сыгранной линии->S17 — Воссоединение перед концом часа]]\n<<endif>>\n<<endif>>\n\n","U06 — Тео обезвредила роботов":"<<set $shorokhRememberedRobotInfo = true>>\n<<set $theoNeutralizedPsyOpsRobots = true>>\n<<set $sweetJohnnyRescued = true>>\n<<if $selectedCharacter is \"shorokh\">>\n<<set $theoLeftSweetJohnny = true>>\n*Через несколько минут Тео перезванивает.*\n\n**Тео**\n\n— Сработало. Роботы отключены, помощь больше не нужна. Остального я пока не расскажу.\n<<else>>\n*Код Шороха останавливает роботов. Тео добирается до комнаты Джони.*\n\n**Тео**\n\n— Всё, Джони. Роботы отключены. Ты жив — и сейчас мы вытащим тебя отсюда.\n<<endif>>\n\n<<if $selectedCharacter is \"theo\">>\n[[Попрощаться с Джони->S25A — Прощание Тео и Сладкого Джони]]\n<<else>>\n[[Вернуться к команде->S17 — Воссоединение перед концом часа]]\n<<endif>>\n\n","C20 — Скрытые проверки группы в участке":"<<silently>>\n<<if not $precinctResolvedOffscreen>>\n<<set $precinctResolvedOffscreen = true>>\n\n/* Рил скрыто проверяет наличие живых. */\n<<if $reLPrecinctLifeScanTotal is null>>\n<<set $reLPrecinctLifeScanDie1 = random(1, 6)>>\n<<set $reLPrecinctLifeScanDie2 = random(1, 6)>>\n<<set $reLPrecinctLifeScanDie3 = random(1, 6)>>\n<<set $reLPrecinctLifeScanTotal = $reLPrecinctLifeScanDie1 + $reLPrecinctLifeScanDie2 + $reLPrecinctLifeScanDie3 + 2>>\n<<if $reLPrecinctLifeScanTotal >= 11>>\n<<set $reLPrecinctLifeScanSucceeded = true>>\n<<else>>\n<<set $reLPrecinctLifeScanSucceeded = false>>\n<<endif>>\n<<endif>>\n\n/* NPC-Шорох скрыто решает, подключаться ли к системе наблюдения. */\n<<if $shorokhSurveillanceConnectionRoll is null>>\n<<set $shorokhSurveillanceConnectionRoll = random(1, 100)>>\n<<endif>>\n<<if $shorokhSurveillanceConnectionRoll <= 80>>\n<<set $shorokhTriedPrecinctSurveillanceConnection = true>>\n<<if $shorokhPrecinctSurveillanceCheckTotal is null>>\n<<set $shorokhPrecinctSurveillanceDie1 = random(1, 6)>>\n<<set $shorokhPrecinctSurveillanceDie2 = random(1, 6)>>\n<<set $shorokhPrecinctSurveillanceDie3 = random(1, 6)>>\n<<set $shorokhPrecinctSurveillanceCheckTotal = $shorokhPrecinctSurveillanceDie1 + $shorokhPrecinctSurveillanceDie2 + $shorokhPrecinctSurveillanceDie3 + 3>>\n<<if $shorokhPrecinctSurveillanceCheckTotal >= 11>>\n<<set $shorokhPrecinctSurveillanceCheckSucceeded = true>>\n<<else>>\n<<set $shorokhPrecinctSurveillanceCheckSucceeded = false>>\n<<set $shorokhLeftArmHp = Math.max(0, $shorokhLeftArmHp - 1)>>\n<<endif>>\n<<endif>>\n<<else>>\n<<set $shorokhTriedPrecinctSurveillanceConnection = false>>\n<<endif>>\n\n/* Шорох скрыто проверяет мину. При успехе Тахи пытается её обезвредить; после любого взрыва NPC-Майкл решает вопрос первой помощи. */\n<<if $shorokhAvoidedPrecinctMine is null>>\n<<set $shorokhPrecinctMineDie1 = random(1, 6)>>\n<<set $shorokhPrecinctMineDie2 = random(1, 6)>>\n<<set $shorokhPrecinctMineDie3 = random(1, 6)>>\n<<set $shorokhPrecinctMineCheckTotal = $shorokhPrecinctMineDie1 + $shorokhPrecinctMineDie2 + $shorokhPrecinctMineDie3 + 1>>\n<<if $shorokhPrecinctMineCheckTotal >= 11>>\n<<set $shorokhAvoidedPrecinctMine = true>>\n<<set $tahiPrecinctMineDefusalDie1 = random(1, 6)>>\n<<set $tahiPrecinctMineDefusalDie2 = random(1, 6)>>\n<<set $tahiPrecinctMineDefusalDie3 = random(1, 6)>>\n<<set $tahiPrecinctMineDefusalTotal = $tahiPrecinctMineDefusalDie1 + $tahiPrecinctMineDefusalDie2 + $tahiPrecinctMineDefusalDie3 + 1>>\n<<if $tahiPrecinctMineDefusalTotal >= 11>>\n<<set $tahiPrecinctMineDefusalSucceeded = true>>\n<<set $precinctMineDefused = true>>\n<<else>>\n<<set $tahiPrecinctMineDefusalSucceeded = false>>\n<<set $precinctMineDefused = false>>\n<<set $tahiRightArmHp = Math.max(0, $tahiRightArmHp - 2)>>\n<<set $tahiLeftArmHp = Math.max(0, $tahiLeftArmHp - 2)>>\n<<set $tahiTorsoHp = Math.max(0, $tahiTorsoHp - 2)>>\n<<if $michaelTahiFirstAidRoll is null>>\n<<set $michaelTahiFirstAidRoll = random(1, 100)>>\n<<endif>>\n<<if $michaelTahiFirstAidRoll <= 80>>\n<<set $michaelProvidedTahiFirstAid = true>>\n<<set $tahiRightArmHp = Math.min(7, $tahiRightArmHp + 1)>>\n<<set $tahiLeftArmHp = Math.min(7, $tahiLeftArmHp + 1)>>\n<<set $tahiTorsoHp = Math.min(12, $tahiTorsoHp + 1)>>\n<<else>>\n<<set $michaelProvidedTahiFirstAid = false>>\n<<endif>>\n<<endif>>\n<<else>>\n<<set $shorokhAvoidedPrecinctMine = false>>\n<<set $shorokhRightLegHp = Math.max(0, $shorokhRightLegHp - 2)>>\n<<set $shorokhLeftLegHp = Math.max(0, $shorokhLeftLegHp - 2)>>\n<<if $michaelFirstAidRoll is null>>\n<<set $michaelFirstAidRoll = random(1, 100)>>\n<<endif>>\n<<if $michaelFirstAidRoll <= 80>>\n<<set $michaelProvidedFirstAid = true>>\n<<set $sho
